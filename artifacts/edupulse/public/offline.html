<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FF3C00">
    <meta name="educore-offline-shell" content="safe">
    <title>EduCore unavailable offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #f7f8fa; }
      body { box-sizing: border-box; display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; }
      main { width: min(100%, 30rem); padding: 32px; border: 1px solid #e4e7ec; border-radius: 20px; background: white; box-shadow: 0 12px 36px #17203312; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
      .mark { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 12px; background: #ff3c00; color: white; }
      h1 { margin: 28px 0 8px; font-size: 1.5rem; }
      p { color: #596579; line-height: 1.6; }
      button { min-height: 44px; margin-top: 12px; padding: 0 18px; border: 0; border-radius: 12px; background: #ff3c00; color: white; font: inherit; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark" aria-hidden="true">ϟ</span> Yemait EduCore</div>
      <h1>EduCore isn’t available offline</h1>
      <p>Reconnect to the internet and try again. School records and account information are not stored for offline use.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
