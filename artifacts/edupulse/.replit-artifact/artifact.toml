kind = "web"
previewPath = "/"
title = "Yemait EduCore"
description = "Yemait EduCore is a multi-tenant school management platform from Yemait Technologies Limited for Nigerian private schools, with secure administration, academics, payments, attendance, and family engagement."
version = "1.0.0"
id = "artifacts/edupulse"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19494

[services.development]
run = "pnpm --filter @workspace/edupulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edupulse", "run", "build" ]
serve = "static"
publicDir = "artifacts/edupulse/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19494"
BASE_PATH = "/"
