paths:
  /platform/nfc-fee-collection-oversight/filter-options:
    get:
      operationId: getNfcFeeCollectionFilterOptions
      tags: [finance]
      summary: Read-only Owner school and academic-term choices from existing records
      parameters:
        - {in: query, name: schoolId, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Schools and terms, scoped to the selected school when specified
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NfcFeeCollectionFilterOptions'}
        '400': {description: Invalid or unknown school}
        '403': {description: Active global Owner required}
        '503': {description: Options unavailable}
  /platform/nfc-fee-collection-oversight:
    get:
      operationId: getNfcFeeCollectionOversight
      tags: [finance]
      summary: Read-only Owner oversight of school NFC fee collection
      parameters:
        - {in: query, name: schoolId, schema: {type: integer, minimum: 1}}
        - {in: query, name: termId, schema: {type: integer, minimum: 1}}
        - {in: query, name: search, schema: {type: string, maxLength: 100}}
        - {in: query, name: status, schema: {type: string, enum: [FULLY_PAID, UNPAID, PENDING_EVIDENCE, UNDER_REVIEW, REJECTED, PARTIALLY_PAID, NOT_CONFIGURED, CANCELLED, REVIEW_REQUIRED]}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Fee line snapshots and minimal payment metadata, never private receipt files
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NfcFeeCollectionOversight'}
        '403': {description: Active global Owner required}
        '400': {description: Invalid filters or academic term outside the selected school}
        '503': {description: Evidence unavailable}
components:
  schemas:
    NfcFeeCollectionSchoolOption:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}
    NfcFeeCollectionTermOption:
      type: object
      required: [id, schoolId, schoolName, sessionName, name, startDate, endDate, isCurrent]
      properties:
        id: {type: integer}
        schoolId: {type: integer}
        schoolName: {type: string}
        sessionName: {type: string}
        name: {type: string}
        startDate: {type: string}
        endDate: {type: string}
        isCurrent: {type: boolean, description: Current active school/session/term and within term dates in Africa/Lagos}
    NfcFeeCollectionFilterOptions:
      type: object
      required: [schools, terms]
      properties:
        schools:
          type: array
          items: {$ref: '#/components/schemas/NfcFeeCollectionSchoolOption'}
        terms:
          type: array
          items: {$ref: '#/components/schemas/NfcFeeCollectionTermOption'}
    NfcFeeCollectionOversight:
      type: object
      required: [items, total, limit, offset]
      properties:
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
        items:
          type: array
          items: {$ref: '#/components/schemas/NfcFeeCollectionRow'}
    NfcFeeCollectionRow:
      type: object
      required: [invoiceId, lineId, schoolId, schoolName, studentId, studentName, admissionNo, termId, termName, feeName, amountMinor, paidMinor, currency, invoiceStatus, status, payments]
      properties:
        invoiceId: {type: [integer, 'null']}
        lineId: {type: [integer, 'null']}
        schoolId: {type: integer}
        schoolName: {type: string}
        studentId: {type: integer}
        studentName: {type: string}
        admissionNo: {type: string}
        termId: {type: integer}
        termName: {type: string}
        feeName: {type: [string, 'null']}
        amountMinor: {type: [integer, 'null']}
        paidMinor: {type: integer}
        currency: {type: string}
        invoiceStatus: {type: string}
        status: {type: string}
        payments:
          type: array
          items:
            type: object
            required: [id, reference, receiptNumber, method, date, amountMinor, status, recordedBy, reviewedBy]
            properties:
              id: {type: integer}
              reference: {type: string}
              receiptNumber: {type: [string, 'null']}
              method: {type: string}
              date: {type: string}
              amountMinor: {type: integer}
              status: {type: string}
              recordedBy: {type: [string, 'null']}
              reviewedBy: {type: [string, 'null']}
