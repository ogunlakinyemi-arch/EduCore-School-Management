paths:
  /student-nfc/assisted-options:
    get:
      operationId: getStudentNfcAssistedOptions
      tags: [student-nfc]
      parameters:
        - name: schoolId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: School-scoped authoritative students, guardians and payable periods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistedNfcOptions"
  /student-nfc/assisted-requests:
    post:
      operationId: createStudentNfcAssistedRequest
      tags: [student-nfc]
      parameters:
        - name: schoolId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [studentId, termId]
              properties:
                studentId: { type: integer, minimum: 1 }
                termId: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Persisted pending Flutterwave TEST reservation and public payment link; not evidence of payment.
          content:
            application/json:
              schema:
                $ref: "./nfc-payment-links.yaml#/components/schemas/NfcPaymentLink"
components:
  schemas:
    AssistedNfcOptions:
      type: object
      required: [students, terms, amountMinor]
      properties:
        amountMinor: { type: integer, enum: [500000] }
        students:
          type: array
          items:
            type: object
            required: [id, firstName, lastName, admissionNo, className, section, parents]
            properties:
              id: { type: integer }
              firstName: { type: string }
              lastName: { type: string }
              admissionNo: { type: string }
              className: { type: string }
              section: { type: string }
              parents:
                type: array
                items:
                  type: object
                  required: [id, name, email, phone, relationshipType]
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    email: { type: [string, "null"] }
                    phone: { type: [string, "null"] }
                    relationshipType: { type: string }
        terms:
          type: array
          items:
            type: object
            required: [id, sessionId, name, sessionName, startDate, endDate, isCurrent]
            properties:
              id: { type: integer }
              sessionId: { type: integer }
              name: { type: string }
              sessionName: { type: string }
              startDate: { type: string, format: date }
              endDate: { type: string, format: date }
              isCurrent: { type: boolean }
