      properties:
        id:
          type: integer
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        routeId:
          type: integer
        routeName:
          type: string
        busId:
          type: integer
        busName:
          type: string
        effectiveDate:
          type: string
          format: date
    TransportSelfAssignment:
      type: object
      required: [id, studentId, schoolId, studentName, busName, registrationNumber, busCapacity, routeName, driverName, pickup, dropoff, schedule, status, effectiveDate, endDate, reason, feeMinor, feePlanAmountMinor, academicSessionId, academicTermId, dueDate, feePlans, currency, invoices]
      properties:
        id:
          type: integer
        studentId:
          type: integer
        schoolId:
          type: integer
        studentName:
          type: string
        busName:
          type: string
        registrationNumber:
          type: string
        busCapacity:
          type: integer
        routeName:
          type: string
        driverName:
          type: string
        driverPhone:
          type: ["string", "null"]
        pickup:
          $ref: "#/components/schemas/TransportStop"
        dropoff:
          $ref: "#/components/schemas/TransportStop"
        schedule:
          $ref: "#/components/schemas/TransportSchedule"
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DEACTIVATED]
        effectiveDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        reason:
          type: string
        feeMinor:
          type: integer
        feePlanAmountMinor:
          type: integer
          minimum: 0
        academicSessionId:
          type: integer
          nullable: true
        academicTermId:
          type: integer
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        feePlans:
          type: array
          items:
            $ref: "#/components/schemas/TransportAssignmentFeePlan"
        currency:
          type: string
          enum: [NGN]
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/TransportInvoiceStatus"
    TransportRouteStaffInput:
      type: object
      additionalProperties: false
      required: [employeeId]
      properties:
        employeeId:
          type: integer
          minimum: 1
        role:
          type: string
          enum: [TEACHER, STAFF, ACCOMPANIER]
          default: ACCOMPANIER
    TransportRouteStaff:
      allOf:
        - $ref: "#/components/schemas/TransportRouteStaffInput"
        - type: object
          required: [routeStaffId, schoolId, routeId, employeeNo, employeeName, employeeType, isActive, createdAt, updatedAt]
          properties:
            routeStaffId:
              type: integer
            schoolId:
              type: integer
            routeId:
              type: integer
            employeeNo:
              type: string
            employeeName:
              type: string
            employeeType:
              type: string
            isActive:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    TransportSchoolPolicy:
      type: object
      required: [schoolId, paymentRequired, suspendWhenOverdue]
      properties:
        schoolId:
          type: integer
        paymentRequired:
          type: boolean
        suspendWhenOverdue:
          type: boolean
    TransportSchoolPolicyUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        paymentRequired:
          type: boolean
        suspendWhenOverdue:
          type: boolean
    TransportTermInvoiceGeneration:
      type: object
      required: [schoolId, academicSessionId, academicTermId, generatedInvoiceIds, billableAssignmentCount]
      properties:
        schoolId:
          type: integer
        academicSessionId:
          type: integer
        academicTermId:
          type: integer
        generatedInvoiceIds:
          type: array
          items:
            type: integer
        billableAssignmentCount:
          type: integer
          minimum: 0
    TransportPlatformOverview:
      type: object
      required: [readOnly, generatedAt, filters, operationalSummary, financeSummary, invoices, invoiceTotalCount]
      properties:
        readOnly:
          type: boolean
          const: true
        generatedAt:
          type: string
          format: date-time
        filters:
          type: object
          additionalProperties: true
        operationalSummary:
          type: object
          additionalProperties: true
        financeSummary:
          type: object
          additionalProperties: true
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/TransportOwnerInvoice"
        invoiceTotalCount:
          type: integer
          minimum: 0
    TransportOwnerInvoice:
      type: object
      required: [invoiceId, schoolId, schoolName, invoiceNumber, studentId, studentName, admissionNo, academicSessionId, sessionName, academicTermId, termName, currency, totalMinor, paidMinor, outstandingMinor, status, issueDate, dueDate, assignmentId, routeId, routeName, driverEmployeeId, driverName, generatedAt, receipts]
      properties:
        invoiceId:
          type: integer
        schoolId:
          type: integer
        schoolName:
          type: string
        invoiceNumber:
          type: string
        studentId:
          type: integer
        studentName:
          type: string
        admissionNo:
          type: string
        academicSessionId:
          type: integer
        sessionName:
          type: string
        academicTermId:
          type: integer
        termName:
          type: string
        currency:
          type: string
        totalMinor:
          type: integer
        paidMinor:
          type: integer
        outstandingMinor:
          type: integer
        status:
          type: string
          enum: [UNPAID, PARTIALLY_PAID, PAID, OVERDUE, WAIVED, CANCELLED]
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        assignmentId:
          type: integer
        routeId:
          type: integer
        routeName:
          type: string
        driverEmployeeId:
          type: integer
        driverName:
          type: string
        generatedAt:
          type: string
          format: date-time
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/TransportReceipt"
    TransportRequestDecision:
