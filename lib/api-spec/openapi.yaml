openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Multi-tenant Yemait EduCore school management API
servers:
  - url: /api
    description: Base API path
security:
  - ClerkAuth: []
tags:
  - name: health
  - name: identity
  - name: parent-portal
  - name: users
  - name: dashboard
  - name: schools
  - name: students
  - name: parents
  - name: classes
  - name: academics
  - name: employees
  - name: subjects
  - name: subscriptions
  - name: cards
  - name: audit
  - name: platform-partners
  - name: partner
  - name: partner-onboarding
  - name: platform
  - name: attendance
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bootstrap/platform-owner/status:
    get:
      security: []
      operationId: getPlatformOwnerBootstrapStatus
      tags: [identity]
      summary: Check whether first-owner setup is available
      responses:
        "200":
          description: Bootstrap availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOwnerBootstrapStatus" }
  /bootstrap/platform-owner:
    post:
      security: []
      operationId: createInitialPlatformOwner
      tags: [identity]
      summary: Securely create the first Platform Owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformOwnerBootstrapInput" }
      responses:
        "201":
          description: Initial owner created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOwnerBootstrapResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Setup has already been completed
  /me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Get the authenticated Yemait EduCore user
      responses:
        "200":
          description: Current user and active role assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/roles:
    get:
      operationId: getCurrentUserRoles
      tags: [identity]
      summary: Get active role assignments
      responses:
        "200":
          description: Active roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoleAssignment" }
  /me/schools:
    get:
      operationId: getCurrentUserSchools
      tags: [identity]
      summary: Get schools available to the authenticated user
      responses:
        "200":
          description: Authorized schools
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuthorizedSchool" }
  /me/authorized-context:
    get:
      operationId: getAuthorizedContext
      tags: [identity]
      summary: Get the authenticated authorization context
      responses:
        "200":
          description: Authorization context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizedContext" }
  /parent/profile:
    get:
      operationId: getParentProfile
      tags: [parent-portal]
      summary: Get the authenticated parent's profile
      responses:
        "200":
          description: Parent profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
  /parent/children:
    get:
      operationId: getParentChildren
      tags: [parent-portal]
      summary: List children linked to the authenticated parent
      responses:
        "200":
          description: Linked children
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ParentChild" }
  /parent/children/{studentId}:
    get:
      operationId: getParentChild
      tags: [parent-portal]
      summary: Get one child linked to the authenticated parent
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
      responses:
        "200":
          description: Authorized child profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentChild" }
        "404": { $ref: "#/components/responses/NotFound" }
  /parent/children/{studentId}/attendance:
    get:
      operationId: getParentChildAttendance
      tags: [parent-portal, attendance]
      summary: Read attendance for a child currently linked to the authenticated parent
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Linked child's attendance without internal device or biometric details
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FamilyAttendanceEvent" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /student/attendance:
    get:
      operationId: getOwnAttendance
      tags: [attendance]
      summary: Read only the authenticated student's attendance
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Own attendance without internal device or biometric details
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FamilyAttendanceEvent" } }
  /student/attendance/{studentId}:
    get:
      operationId: getStudentOwnAttendanceById
      tags: [attendance]
      summary: Read attendance only when the requested student ID belongs to the authenticated user
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Own attendance
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FamilyAttendanceEvent" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /parent-student-relationships:
    get:
      operationId: listParentStudentRelationships
      tags: [parent-portal]
      summary: List authorized parent-student relationships
      parameters:
        - name: schoolId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Relationships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ParentStudentRelationship" }
    post:
      operationId: createParentStudentRelationship
      tags: [parent-portal]
      summary: Link a parent and student in an authorized school
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentStudentRelationshipInput" }
      responses:
        "201":
          description: Relationship created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentRelationship" }
  /parent-student-relationships/{relationshipId}:
    patch:
      operationId: updateParentStudentRelationship
      tags: [parent-portal]
      summary: Update an authorized parent-student relationship
      parameters:
        - $ref: "#/components/parameters/RelationshipIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentStudentRelationshipUpdate" }
      responses:
        "200":
          description: Relationship updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentRelationship" }
    delete:
      operationId: deactivateParentStudentRelationship
      tags: [parent-portal]
      summary: Deactivate a relationship while preserving history
      parameters:
        - $ref: "#/components/parameters/RelationshipIdPath"
      responses:
        "204": { description: Relationship deactivated }
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List Yemait EduCore users for platform administration
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppUser" }
  /platform-users:
    post:
      operationId: createPlatformMembership
      tags: [users]
      summary: Assign an authorized platform role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformMembershipInput" }
      responses:
        "201":
          description: Platform membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleAssignment" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /school-users:
    get:
      operationId: listSchoolUsers
      tags: [users]
      summary: List users in an authorized school
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: School users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchoolUser" }
    post:
      operationId: createSchoolMembership
      tags: [users]
      summary: Add or reactivate an authorized school membership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolMembershipInput" }
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleAssignment" }
  /schools/{schoolId}/administrators:
    post:
      operationId: createSchoolAdministrator
      tags: [users]
      summary: Create a Clerk-backed School Administrator account
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolAdministratorInput" }
      responses:
        "201":
          description: School Administrator created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAdministratorResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /platform/devices:
    get:
      operationId: listPlatformDevices
      tags: [platform]
      summary: List NFC and biometric devices and school assignments
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PlatformDevice" } }
    post:
      operationId: createPlatformDevice
      tags: [platform]
      summary: Register and optionally assign a device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformDeviceInput" }
      responses:
        "201":
          description: Device created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformDevice" }
  /platform/devices/{deviceId}:
    patch:
      operationId: updatePlatformDevice
      tags: [platform]
      summary: Change a device assignment or status
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformDeviceUpdate" }
      responses:
        "200":
          description: Device updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformDevice" }
  /platform/devices/{deviceId}/assign:
    post:
      operationId: assignPlatformDevice
      tags: [platform]
      summary: Assign a device to a school and location
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceAssignmentInput" }
      responses:
        "200":
          description: Device assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformDevice" }
        "400": { $ref: "#/components/responses/ApiBadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /platform/devices/{deviceId}/suspend:
    post:
      operationId: suspendPlatformDevice
      tags: [platform]
      summary: Suspend a device and reject its attendance submissions
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceSuspensionInput" }
      responses:
        "200":
          description: Suspended device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformDevice" }
        "404": { $ref: "#/components/responses/NotFound" }
  /platform/devices/{deviceId}/credential:
    post:
      operationId: rotatePlatformDeviceCredential
      tags: [platform]
      summary: Rotate a device credential
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: New credential; the raw value is returned once and is never persisted or returned again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCredentialRotation" }
        "404": { $ref: "#/components/responses/NotFound" }
  /platform/notifications:
    get:
      operationId: listPlatformNotifications
      tags: [platform]
      summary: List Platform Owner notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PlatformNotification" } }
  /school/attendance/today:
    get:
      operationId: getSchoolAttendanceToday
      tags: [attendance]
      summary: Get today's attendance summary for an authorized school
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Attendance summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceToday" }
  /school/attendance/events:
    get:
      operationId: listSchoolAttendanceEvents
      tags: [attendance]
      summary: List school attendance events
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: studentId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: employeeId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: classId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: section
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: eventType
          in: query
          schema: { $ref: "#/components/schemas/AttendanceEventType" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AttendanceStatus" }
        - name: identificationMethod
          in: query
          schema: { $ref: "#/components/schemas/IdentificationMethod" }
      responses:
        "200":
          description: Attendance events
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AttendanceEvent" } }
  /school/attendance/students/{studentId}:
    get:
      operationId: getStudentAttendance
      tags: [attendance]
      summary: Get attendance history for a student
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
        - $ref: "#/components/parameters/SchoolId"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Student attendance
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AttendanceEvent" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /school/attendance/classes/{classId}:
    get:
      operationId: getClassAttendance
      tags: [attendance]
      summary: Get attendance for a class
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/SchoolId"
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Class attendance
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AttendanceEvent" } }
  /school/attendance/discrepancies:
    get:
      operationId: listAttendanceDiscrepancies
      tags: [attendance]
      summary: List attendance reconciliation discrepancies
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, RESOLVED, DISMISSED] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Discrepancies
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AttendanceDiscrepancy" } }
  /school/attendance/discrepancies/{discrepancyId}/resolve:
    post:
      operationId: resolveAttendanceDiscrepancy
      tags: [attendance]
      summary: Resolve or dismiss an open discrepancy within the authorized school
      parameters:
        - name: discrepancyId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscrepancyResolutionInput" }
      responses:
        "200":
          description: Historical discrepancy with resolution details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceDiscrepancy" }
        "404": { $ref: "#/components/responses/NotFound" }
  /school/attendance/manual:
    post:
      operationId: createManualAttendance
      tags: [attendance]
      summary: Record attendance manually with an auditable reason
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualAttendanceInput" }
      responses:
        "201":
          description: Manual attendance event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceEvent" }
        "400": { $ref: "#/components/responses/ApiBadRequest" }
  /school/attendance/{attendanceId}/correct:
    post:
      operationId: correctAttendance
      tags: [attendance]
      summary: Correct attendance without overwriting its history
      parameters:
        - name: attendanceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceCorrectionInput" }
      responses:
        "200":
          description: Corrected attendance event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceEvent" }
        "404": { $ref: "#/components/responses/NotFound" }
  /device/attendance/events:
    post:
      operationId: ingestDeviceAttendanceEvent
      tags: [attendance]
      security:
        - DeviceCredential: []
      summary: Ingest an NFC or provider-resolved biometric attendance event
      description: Device identity and school binding are derived from the credential, never trusted from the request body. Raw biometric data and credential hashes are not accepted or returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceAttendanceEventInput" }
      responses:
        "201":
          description: Attendance event accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceEvent" }
        "400": { $ref: "#/components/responses/ApiBadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { description: Duplicate or rejected event, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /students/{studentId}/identification-methods:
    get:
      operationId: listStudentIdentificationMethods
      tags: [students]
      summary: Get a student's configured identification policy and references
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Identification methods (no biometric material)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentIdentificationPolicy" }
    post:
      operationId: updateStudentIdentificationMethods
      tags: [students]
      summary: Configure a student's identification policy
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentIdentificationPolicyInput" }
      responses:
        "200":
          description: Updated identification policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentIdentificationPolicy" }
  /students/{studentId}/biometric-enrollments:
    post:
      operationId: createBiometricEnrollment
      tags: [students]
      summary: Register a provider enrollment reference without storing biometric data
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BiometricEnrollmentInput" }
      responses:
        "201":
          description: Biometric enrollment reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BiometricEnrollment" }
  /biometric/events:
    post:
      operationId: ingestBiometricProviderEvent
      tags: [attendance]
      security:
        - DeviceCredential: []
      summary: Ingest a provider-resolved biometric match
      description: Accepts only a provider reference and match result; raw biometric templates and images are never accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BiometricProviderEventInput" }
      responses:
        "201":
          description: Attendance event created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceEvent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /cards/{cardId}/history:
    get:
      operationId: getCardHistory
      tags: [cards]
      summary: View immutable NFC card lifecycle history
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      responses:
        "200":
          description: Card history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CardHistoryEntry" } }
  /cards/{cardId}/replace:
    post:
      operationId: replaceCard
      tags: [cards]
      summary: Replace a card while preserving the old card record
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardReplacementInput" }
      responses:
        "201":
          description: Replacement card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NfcCard" }
  /platform/notifications/{notificationId}/read:
    patch:
      operationId: markPlatformNotificationRead
      tags: [platform]
      summary: Mark a Platform Owner notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Notification updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformNotification" }
  /dashboard/platform:
    get:
      operationId: getPlatformDashboard
      tags: [dashboard]
      summary: Platform owner dashboard
      responses:
        "200":
          description: Platform dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDashboard"
  /dashboard/school:
    get:
      operationId: getSchoolDashboard
      tags: [dashboard]
      summary: School operations dashboard
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: School dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolDashboard"
  /schools:
    get:
      operationId: listSchools
      tags: [schools]
      summary: List schools
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, inactive, all]
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Schools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/School"
    post:
      operationId: createSchool
      tags: [schools]
      summary: Create school
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolInput"
      responses:
        "201":
