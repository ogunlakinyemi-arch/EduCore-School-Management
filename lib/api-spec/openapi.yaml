        schoolId: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: ["string", "null"] }
        relationshipType: { type: ["string", "null"], enum: [Father, Mother, Guardian, Grandparent, Other, null] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        clerkUserId: { type: ["string", "null"] }
        emergencyContactName: { type: ["string", "null"] }
        emergencyContactPhone: { type: ["string", "null"] }
