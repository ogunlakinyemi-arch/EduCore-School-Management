  /schools/{schoolId}/students/{studentId}/welfare/{recordId}/history:
    $ref: "./student-care-expansion.yaml#/paths/~1schools~1{schoolId}~1students~1{studentId}~1welfare~1{recordId}~1history"
  /schools/{schoolId}/students/{studentId}/behaviour:
    $ref: "./student-care-expansion.yaml#/paths/~1schools~1{schoolId}~1students~1{studentId}~1behaviour"
  /schools/{schoolId}/students/{studentId}/behaviour/{recordId}:
    $ref: "./student-care-expansion.yaml#/paths/~1schools~1{schoolId}~1students~1{studentId}~1behaviour~1{recordId}"
  /schools/{schoolId}/students/{studentId}/behaviour/{recordId}/history:
    $ref: "./student-care-expansion.yaml#/paths/~1schools~1{schoolId}~1students~1{studentId}~1behaviour~1{recordId}~1history"
