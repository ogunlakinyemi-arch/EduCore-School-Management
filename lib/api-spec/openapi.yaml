      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: Clerk state plus an explicit unverified delivery result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationDiagnostics" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Clerk invitation status could not be checked }
  /school-users/invitations:
