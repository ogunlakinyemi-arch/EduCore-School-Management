          required: true
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: beforeId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: School-scoped campaign history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationAnnouncementHistory" }
    post:
      operationId: createCommunicationAnnouncement
      tags: [communication]
      summary: Send an idempotent school announcement to server-resolved recipients
      description: School Admins may send school-wide announcements within their own school. Teachers may communicate only with recipients in their authorized classes or sections. Accountants may send finance-related communications only within their authorized school. Platform Owners may never send ordinary school announcements, including when they also hold a school role. Recipient identities are derived and revalidated by the server; caller-supplied target criteria never bypass school, class, or parent-child authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunicationAnnouncementInput" }
      responses:
        "201":
          description: Campaign created and channel delivery work recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationAnnouncement" }
        "200":
          description: Idempotent replay returned the existing campaign for the same key and request content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationAnnouncement" }
        "409":
          description: Idempotency key was reused with different announcement content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /communication/announcements/{campaignId}:
    get:
      operationId: getCommunicationAnnouncement
      tags: [communication]
      summary: Get an authorized campaign and per-recipient channel delivery statuses
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: School-scoped campaign with recipient roles and sanitized delivery outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationAnnouncementDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /communication/deliveries/{deliveryId}/retry:
    post:
      operationId: retryCommunicationDelivery
      tags: [communication]
      summary: Retry an eligible failed school communication delivery
      description: Requires authorized school communication management. Permanent failures and exhausted retries cannot be retried. Credentials, addresses, and provider payloads are never returned.
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated sanitized delivery state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationDelivery" }
        "404": { $ref: "#/components/responses/NotFound" }
  /communication/schools/{schoolId}/defaults:
    parameters:
      - { name: schoolId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getSchoolCommunicationDefaults
      tags: [Communication]
      responses:
        "200":
          description: School category channel defaults
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolCommunicationDefaultsResponse" }
    put:
      operationId: updateSchoolCommunicationDefaults
      tags: [Communication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolCommunicationDefaults" }
      responses:
        "200":
          description: Updated category defaults
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolCommunicationDefaultsResponse" }
  /communication/push-configuration:
    get:
      operationId: getCommunicationPushConfiguration
      tags: [Communication]
      responses:
        "200":
          description: Public application-server key only, never a VAPID private key
          content:
            application/json:
              schema:
                type: object
                required: [configured, publicKey]
                properties:
                  configured: { type: boolean }
                  publicKey: { type: ["string", "null"] }
  /communication/push-devices/revoke-session:
    post:
      operationId: revokeCommunicationPushSession
      tags: [Communication]
      responses:
        "204": { description: Current authenticated session devices revoked }
  /communication/push-devices:
    get:
      operationId: listCommunicationPushDevices
      tags: [communication]
      summary: List the authenticated user's registered push-device references
      parameters:
        - name: schoolId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: User-owned device metadata without device secrets or endpoints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CommunicationPushDevice" }
    post:
      operationId: registerCommunicationPushDevice
      tags: [communication]
      summary: Register an opaque push-device reference for the authenticated user
      description: Push delivery is future-ready only. This endpoint stores a caller-owned opaque reference; it does not accept raw subscription secrets or device personal information.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunicationPushDeviceInput" }
      responses:
        "201":
          description: Registered device metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationPushDevice" }
  /communication/push-devices/{deviceId}:
    delete:
      operationId: revokeCommunicationPushDevice
      tags: [communication]
      summary: Revoke a push-device reference owned by the authenticated user
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Device reference revoked }
        "404": { $ref: "#/components/responses/NotFound" }
