openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Multi-tenant Yemait EduCore school management API
servers:
  - url: /api
    description: Base API path
security:
  - ClerkAuth: []
tags:
  - name: health
  - name: identity
  - name: parent-portal
  - name: users
  - name: dashboard
  - name: schools
  - name: students
  - name: parents
  - name: classes
  - name: academics
  - name: employees
  - name: subjects
  - name: subscriptions
  - name: cards
  - name: audit
  - name: platform-partners
  - name: partner
  - name: partner-onboarding
  - name: platform
  - name: attendance
  - name: finance
  - name: communication
  - name: promotion
paths:
  /card-replacements:
    get:
      operationId: listCardReplacements
      tags: [cards]
      parameters:
        - in: query
          name: schoolId
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Owner, school-admin or own/linked-child replacement records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardReplacementDirectory' }
    post:
      operationId: requestCardReplacement
      tags: [cards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentCardReplacementRequest' }
      responses:
        '200':
          description: Persisted replacement request and separate NGN 2000 invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardReplacement' }
  /card-replacements/{requestId}/issue:
    post:
      operationId: issueCardReplacement
      tags: [cards]
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardReplacementIssuance' }
      responses:
        '200':
          description: Owner-issued prepared UID; verified invoice payment required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardReplacement' }
  /card-replacements/{requestId}/verify:
    post:
      operationId: verifyCardReplacementPayment
      tags: [cards]
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardReplacementVerification' }
      responses:
        '200':
          description: Independently verified using existing Flutterwave adapter and settlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardReplacement' }
  /student/attendance-periods:
    get:
      operationId: getOwnAttendancePeriods
      tags: [attendance]
      responses:
        "200":
          description: Academic periods from the authenticated student's school
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyAttendancePeriods" }
  /parent/children/{studentId}/attendance-periods:
    get:
      operationId: getChildAttendancePeriods
      tags: [attendance]
      parameters:
        - in: path
          name: studentId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Academic periods from this active linked child's school
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyAttendancePeriods" }
        "404": { description: Not an authorized linked child }
  /library/permissions:
    get:
      operationId: getLibraryPermissions
      tags: [library]
      parameters:
        - in: query
          name: schoolId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Current account's live school-library capabilities
          content:
            application/json:
              schema:
                type: object
                required: [canManageLoans, canManageCatalogue, canAssignStaff]
                properties:
                  canManageLoans: { type: boolean }
                  canManageCatalogue: { type: boolean }
                  canAssignStaff: { type: boolean }
  /library/staff:
    get:
      operationId: listLibraryStaff
      tags: [library]
      parameters:
        - in: query
          name: schoolId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Admin sees school duties; other viewers see only their own duties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LibraryStaffDuty" }
  /driver/transport:
    get:
      operationId: getDriverTransport
      tags: [transport]
      summary: Read the active driver's own routes and assigned riders
      parameters:
        - in: query
          name: schoolId
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Own-school driver transport without grades or financial data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverTransportView" }
        "403": { description: Active Driver role required }
        "404": { description: Active bound driver employee not found }
