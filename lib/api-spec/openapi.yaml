components:
  securitySchemes:
    ClerkAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
      description: Clerk session cookie or bearer token validated by the API
    DeviceCredential:
      type: apiKey
      in: header
      name: X-Device-Credential
      description: Revocable device credential; the raw value is write-only and must never be logged or returned after rotation
  responses:
    ApiBadRequest:
      description: Invalid request or rejected school/device/student relationship
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource not found or outside authorized visibility
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  parameters:
    SchoolId:
      name: schoolId
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    SchoolIdPath:
      name: schoolId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StudentIdPath:
      name: studentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SubscriptionIdPath:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CardIdPath:
      name: cardId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RelationshipIdPath:
      name: relationshipId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ParentIdPath:
      name: parentId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    EmployeeIdPath:
      name: employeeId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SubjectIdPath:
      name: subjectId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SessionId:
      name: sessionId
      in: query
      schema: { type: integer, minimum: 1 }
    TermIdPath:
      name: termId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    StatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum: [ACTIVE, INACTIVE, all]
    Search:
      name: search
      in: query
      schema:
        type: string
    PartnerIdPath:
      name: partnerId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    InvitationTokenPath:
      name: invitationToken
      in: path
      required: true
      description: Opaque, single-use, high-entropy invitation token. Never a database identifier.
      schema:
        type: string
        minLength: 32
        pattern: "^[A-Za-z0-9_-]{32,}$"
    ConflictIdPath:
      name: conflictId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RuleIdPath:
      name: ruleId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PayoutIdPath:
      name: payoutId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    CommissionIdPath:
      name: commissionId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    PlatformOwnerBootstrapStatus:
      type: object
      required: [available, configured]
      properties:
        available: { type: boolean }
        configured: { type: boolean }
    PlatformOwnerBootstrapInput:
      type: object
      required: [setupKey, fullName, email, phone, password]
      properties:
        setupKey: { type: string, minLength: 16, maxLength: 256 }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 8, maxLength: 25 }
        password: { type: string, minLength: 15, maxLength: 256 }
    PlatformOwnerBootstrapResult:
      type: object
      required: [created, signInPath]
      properties:
        created: { type: boolean, const: true }
        signInPath: { type: string }
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    PlatformDashboard:
      type: object
      required: [totalSchools, activeSchools, suspendedSchools, totalStudents, activeSubscriptions, pendingPayments, revenue, schoolAllocation, edupulseAllocation, activeCards, lockedCards, recentActivity]
      properties:
        totalSchools: { type: integer }
        activeSchools: { type: integer }
        suspendedSchools: { type: integer }
        totalStudents: { type: integer }
        activeSubscriptions: { type: integer }
        pendingPayments: { type: integer }
        revenue: { type: number }
        schoolAllocation: { type: number }
        edupulseAllocation: { type: number }
        activeCards: { type: integer }
        lockedCards: { type: integer }
        inactiveSchools: { type: integer }
        totalTeachers: { type: integer }
        totalParents: { type: integer }
        subscriptionSummary:
          type: object
          additionalProperties: { type: integer }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
    SchoolDashboard:
      type: object
      required: [school, totalStudents, activeStudents, unpaidStudents, pendingPayments, activeCards, lockedCards, recentActivity]
      properties:
        school: { $ref: "#/components/schemas/School" }
        totalStudents: { type: integer }
        activeStudents: { type: integer }
        unpaidStudents: { type: integer }
        attendanceRate: { type: ["number", "null"] }
        pendingPayments: { type: integer }
        activeCards: { type: integer }
        lockedCards: { type: integer }
        totalParents: { type: integer }
        activeTeachers: { type: integer }
        otherStaff: { type: integer }
        totalClasses: { type: integer }
        totalSections: { type: integer }
        totalSubjects: { type: integer }
        currentAcademicSession: { $ref: "#/components/schemas/AcademicSession" }
        currentTerm: { $ref: "#/components/schemas/AcademicTerm" }
        subscriptionStatus: { type: ["string", "null"] }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
    School:
      type: object
      required: [id, code, name, city, state, status, studentCount, staffCount, subscriptionStatus, createdAt]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        city: { type: string }
        state: { type: string }
        registrationNumber: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        lga: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"], format: email }
        website: { type: ["string", "null"], format: uri }
        logoUrl: { type: ["string", "null"], format: uri }
        schoolType: { type: ["string", "null"] }
        administrators:
          type: array
          items: { $ref: "#/components/schemas/SchoolUser" }
        academicSetupStatus: { type: ["string", "null"] }
        status:
          type: string
          enum: [active, suspended, inactive]
        studentCount: { type: integer }
        staffCount: { type: integer }
        subscriptionStatus:
          type: string
          enum: [active, attention, expired]
        createdAt: { type: string }
    SchoolInput:
      type: object
      required: [name, city, state, code]
      properties:
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 2 }
        city: { type: string, minLength: 2 }
        state: { type: string, minLength: 2 }
        registrationNumber: { type: string }
        address: { type: string }
        lga: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        website: { type: string, format: uri }
        logoUrl: { type: string, format: uri }
        schoolType: { type: string }
        status:
          type: string
          enum: [active, suspended, inactive]
    SchoolUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        city: { type: string, minLength: 2 }
        state: { type: string, minLength: 2 }
        code: { type: string, minLength: 1 }
        registrationNumber: { type: string }
        address: { type: string }
        lga: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        website: { type: string, format: uri }
        logoUrl: { type: string, format: uri }
        schoolType: { type: string }
        status:
          type: string
          enum: [active, suspended, inactive]
    SchoolStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, suspended, inactive] }
    Student:
      type: object
      required: [id, schoolId, admissionNo, firstName, lastName, gender, className, section, status, subscriptionStatus, cardStatus, joinedAt]
      properties:
        id: { type: integer }
        schoolId: { type: integer }
        admissionNo: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        middleName: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"], format: date }
        passportUrl: { type: ["string", "null"], format: uri }
        admissionDate: { type: ["string", "null"], format: date }
        admissionStatus: { type: ["string", "null"], enum: [pending, admitted, rejected] }
        address: { type: ["string", "null"] }
        previousSchool: { type: ["string", "null"] }
        medicalInformation: { type: ["string", "null"] }
        emergencyContactName: { type: ["string", "null"] }
        emergencyContactPhone: { type: ["string", "null"] }
        currentClassId: { type: ["integer", "null"] }
        currentSessionId: { type: ["integer", "null"] }
        currentTermId: { type: ["integer", "null"] }
        createdAt: { type: ["string", "null"], format: date-time }
        updatedAt: { type: ["string", "null"], format: date-time }
        gender:
          type: string
          enum: [female, male, other]
        className: { type: string }
        section: { type: string }
        parentName: { type: ["string", "null"] }
        parentPhone: { type: ["string", "null"] }
        status:
          type: string
          enum: [ACTIVE, INACTIVE, GRADUATED, TRANSFERRED, WITHDRAWN]
        subscriptionStatus:
          type: string
          enum: [active, unpaid, pending, expired]
        cardStatus:
          type: string
          enum: [active, locked, unassigned, lost]
        joinedAt: { type: string }
    StudentInput:
      type: object
      required: [admissionNo, firstName, lastName, gender, className, section]
      properties:
        admissionNo: { type: string, minLength: 1 }
        firstName: { type: string, minLength: 2 }
        lastName: { type: string, minLength: 2 }
        middleName: { type: string }
        dateOfBirth: { type: string, format: date }
        passportUrl: { type: string, format: uri }
        admissionDate: { type: string, format: date }
        admissionStatus: { type: string, enum: [pending, admitted, rejected] }
        address: { type: string }
        previousSchool: { type: string }
        medicalInformation: { type: string }
        emergencyContactName: { type: string }
        emergencyContactPhone: { type: string }
        gender:
          type: string
          enum: [female, male, other]
        className: { type: string, minLength: 1 }
        section: { type: string, minLength: 1 }
        parentName: { type: string }
        parentPhone: { type: string }
    StudentUpdate:
      type: object
      properties:
        firstName: { type: string, minLength: 2 }
        lastName: { type: string, minLength: 2 }
        className: { type: string }
        section: { type: string }
        middleName: { type: string }
        dateOfBirth: { type: string, format: date }
        passportUrl: { type: string, format: uri }
        admissionStatus: { type: string, enum: [pending, admitted, rejected] }
        address: { type: string }
        previousSchool: { type: string }
        medicalInformation: { type: string }
        emergencyContactName: { type: string }
        emergencyContactPhone: { type: string }
        status:
          type: string
          enum: [ACTIVE, INACTIVE, GRADUATED, TRANSFERRED, WITHDRAWN]
