openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Multi-tenant EduPulse school management API
servers:
  - url: /api
    description: Base API path
security:
  - ClerkAuth: []
tags:
  - name: health
  - name: identity
  - name: parent-portal
  - name: users
  - name: dashboard
  - name: schools
  - name: students
  - name: parents
  - name: classes
  - name: academics
  - name: employees
  - name: subjects
  - name: subscriptions
  - name: cards
  - name: audit
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Get the authenticated EduPulse user
      responses:
        "200":
          description: Current user and active role assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/roles:
    get:
      operationId: getCurrentUserRoles
      tags: [identity]
      summary: Get active role assignments
      responses:
        "200":
          description: Active roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoleAssignment" }
  /me/schools:
    get:
      operationId: getCurrentUserSchools
      tags: [identity]
      summary: Get schools available to the authenticated user
      responses:
        "200":
          description: Authorized schools
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuthorizedSchool" }
  /me/authorized-context:
    get:
      operationId: getAuthorizedContext
      tags: [identity]
      summary: Get the authenticated authorization context
      responses:
        "200":
          description: Authorization context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizedContext" }
  /parent/profile:
    get:
      operationId: getParentProfile
      tags: [parent-portal]
      summary: Get the authenticated parent's profile
      responses:
        "200":
          description: Parent profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
  /parent/children:
    get:
      operationId: getParentChildren
      tags: [parent-portal]
      summary: List children linked to the authenticated parent
      responses:
        "200":
          description: Linked children
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ParentChild" }
  /parent/children/{studentId}:
    get:
      operationId: getParentChild
      tags: [parent-portal]
      summary: Get one child linked to the authenticated parent
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
      responses:
        "200":
          description: Authorized child profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentChild" }
        "404": { $ref: "#/components/responses/NotFound" }
  /parent-student-relationships:
    get:
      operationId: listParentStudentRelationships
      tags: [parent-portal]
      summary: List authorized parent-student relationships
      parameters:
        - name: schoolId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Relationships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ParentStudentRelationship" }
    post:
      operationId: createParentStudentRelationship
      tags: [parent-portal]
      summary: Link a parent and student in an authorized school
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentStudentRelationshipInput" }
      responses:
        "201":
          description: Relationship created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentRelationship" }
  /parent-student-relationships/{relationshipId}:
    patch:
      operationId: updateParentStudentRelationship
      tags: [parent-portal]
      summary: Update an authorized parent-student relationship
      parameters:
        - $ref: "#/components/parameters/RelationshipIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentStudentRelationshipUpdate" }
      responses:
        "200":
          description: Relationship updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentRelationship" }
    delete:
      operationId: deactivateParentStudentRelationship
      tags: [parent-portal]
      summary: Deactivate a relationship while preserving history
      parameters:
        - $ref: "#/components/parameters/RelationshipIdPath"
      responses:
        "204": { description: Relationship deactivated }
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List EduPulse users for platform administration
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppUser" }
  /platform-users:
    post:
      operationId: createPlatformMembership
      tags: [users]
      summary: Assign an authorized platform role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformMembershipInput" }
      responses:
        "201":
          description: Platform membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleAssignment" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /school-users:
    get:
      operationId: listSchoolUsers
      tags: [users]
      summary: List users in an authorized school
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: School users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchoolUser" }
    post:
      operationId: createSchoolMembership
      tags: [users]
      summary: Add or reactivate an authorized school membership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolMembershipInput" }
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleAssignment" }
  /dashboard/platform:
    get:
      operationId: getPlatformDashboard
      tags: [dashboard]
      summary: Platform owner dashboard
      responses:
        "200":
          description: Platform dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDashboard"
  /dashboard/school:
    get:
      operationId: getSchoolDashboard
      tags: [dashboard]
      summary: School operations dashboard
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: School dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolDashboard"
  /schools:
    get:
      operationId: listSchools
      tags: [schools]
      summary: List schools
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, inactive, all]
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Schools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/School"
    post:
      operationId: createSchool
      tags: [schools]
      summary: Create school
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolInput"
      responses:
        "201":
          description: Created school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"
  /schools/{schoolId}:
    get:
      operationId: getSchool
      tags: [schools]
      summary: Get school
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
      responses:
        "200":
          description: School
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"
    patch:
      operationId: updateSchool
      tags: [schools]
      summary: Update school
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolUpdate"
      responses:
        "200":
          description: Updated school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"
  /schools/{schoolId}/status:
    patch:
      operationId: updateSchoolStatus
      tags: [schools]
      summary: Activate or deactivate a school
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolStatusUpdate" }
      responses:
        "200":
          description: Updated school
          content:
            application/json:
              schema: { $ref: "#/components/schemas/School" }
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students in a tenant
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, GRADUATED, TRANSFERRED, WITHDRAWN, all]
        - name: classId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a student
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
  /students/{studentId}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a student
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update a student
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
  /students/{studentId}/status:
    patch:
      operationId: updateStudentStatus
      tags: [students]
      summary: Change a student's status
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentStatusUpdate" }
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
  /students/{studentId}/class-assignments:
    get:
      operationId: listStudentClassAssignments
      tags: [students]
      summary: List current and historical class assignments
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: Class assignment history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentClassAssignment" }
    post:
      operationId: assignStudentClass
      tags: [students]
      summary: Assign a student to a class without deleting history
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentClassAssignmentInput" }
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentClassAssignment" }
  /parents:
    get:
      operationId: listParents
      tags: [parents]
      summary: List parents
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Parents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Parent"
    post:
      operationId: createParent
      tags: [parents]
      summary: Create a parent
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentInput"
      responses:
        "201":
          description: Created parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parent"
  /parents/{parentId}:
    get:
      operationId: getParent
      tags: [parents]
      summary: Get a parent profile
      parameters:
        - $ref: "#/components/parameters/ParentIdPath"
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Parent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Parent" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateParent
      tags: [parents]
      summary: Update a parent profile
      parameters:
        - $ref: "#/components/parameters/ParentIdPath"
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentUpdate" }
      responses:
        "200":
          description: Updated parent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Parent" }
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: Search teachers and non-teaching staff
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/Search"
        - name: employeeId
          in: query
          schema: { type: string }
        - name: department
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/EmployeeType" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EmployeeStatus" }
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Employee" }
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create a teacher or staff member
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
  /employees/{employeeId}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee profile
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee profile
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeUpdate" }
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
  /employees/{employeeId}/status:
    patch:
      operationId: updateEmployeeStatus
      tags: [employees]
      summary: Change employee status
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeStatusUpdate" }
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List classes and sections
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchoolClass"
    post:
      operationId: createClass
      tags: [classes]
      summary: Create a class
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "201":
          description: Created class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolClass"
  /academic-sessions:
    get:
      operationId: listAcademicSessions
      tags: [academics]
      summary: List academic sessions
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: Academic sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AcademicSession" }
    post:
      operationId: createAcademicSession
      tags: [academics]
      summary: Create an academic session
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicSessionInput" }
      responses:
        "201":
          description: Academic session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSession" }
  /academic-sessions/{sessionId}/terms:
    get:
      operationId: listAcademicTerms
      tags: [academics]
      summary: List terms in an academic session
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Academic terms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AcademicTerm" }
    post:
      operationId: createAcademicTerm
      tags: [academics]
      summary: Create an academic term
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicTermInput" }
      responses:
        "201":
          description: Academic term created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicTerm" }
  /academic-sessions/{sessionId}:
    patch:
      operationId: updateAcademicSession
      tags: [academics]
      summary: Update an academic session
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicSessionUpdate" }
      responses:
        "200":
          description: Updated academic session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSession" }
  /academic-terms/{termId}:
    patch:
      operationId: updateAcademicTerm
      tags: [academics]
      summary: Update an academic term
      parameters:
        - $ref: "#/components/parameters/TermIdPath"
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicTermUpdate" }
      responses:
        "200":
          description: Updated academic term
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicTerm" }
  /subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      summary: Search school subjects
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SubjectStatus" }
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subject" }
    post:
      operationId: createSubject
      tags: [subjects]
      summary: Create a subject
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubjectInput" }
      responses:
        "201":
          description: Subject created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subject" }
  /subjects/{subjectId}:
    get:
      operationId: getSubject
      tags: [subjects]
      summary: Get a subject
      parameters:
        - $ref: "#/components/parameters/SubjectIdPath"
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Subject
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subject" }
    patch:
      operationId: updateSubject
      tags: [subjects]
      summary: Update a subject
      parameters:
        - $ref: "#/components/parameters/SubjectIdPath"
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubjectUpdate" }
      responses:
        "200":
          description: Updated subject
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subject" }
  /class-subject-assignments:
    get:
      operationId: listClassSubjectAssignments
      tags: [subjects]
      summary: List subjects assigned to classes
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: classId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: subjectId
          in: query
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Class subject assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSubjectAssignment" }
    post:
      operationId: assignClassSubject
      tags: [subjects]
      summary: Assign a subject to a class
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassSubjectAssignmentInput" }
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassSubjectAssignment" }
  /teacher-class-assignments:
    get:
      operationId: listTeacherClassAssignments
      tags: [employees]
      summary: List current and historical teacher class assignments
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: employeeId
          in: query
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/StatusFilter"
      responses:
        "200":
          description: Teacher assignment history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeacherClassAssignment" }
    post:
      operationId: assignTeacherClass
      tags: [employees]
      summary: Assign a teacher to a class
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherClassAssignmentInput" }
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherClassAssignment" }
  /student/profile:
    get:
      operationId: getStudentSelfProfile
      tags: [students]
      summary: Get the authenticated student's own profile
      responses:
        "200":
          description: Student self profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List subscription ledger records
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, pending, expired, failed, all]
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a pending subscription payment
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Pending subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
  /subscriptions/{subscriptionId}/verify:
    post:
      operationId: verifySubscription
      tags: [subscriptions]
      summary: Verify a provider payment and activate entitlement
      parameters:
        - $ref: "#/components/parameters/SubscriptionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentVerificationInput"
      responses:
        "200":
          description: Verified subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
  /cards:
    get:
      operationId: listCards
      tags: [cards]
      summary: List NFC cards
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, locked, unassigned, lost, all]
      responses:
        "200":
          description: NFC cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NfcCard"
    post:
      operationId: registerCard
      tags: [cards]
      summary: Register an NFC card
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardInput"
      responses:
        "201":
          description: Registered card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfcCard"
  /cards/{cardId}/status:
    patch:
      operationId: updateCardStatus
      tags: [cards]
      summary: Change a card state
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardStatusInput"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfcCard"
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit activity
      parameters:
        - name: schoolId
          in: query
          schema:
            type: integer
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
components:
  securitySchemes:
    ClerkAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
      description: Clerk session cookie or bearer token validated by the API
  responses:
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource not found or outside authorized visibility
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  parameters:
    SchoolId:
      name: schoolId
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    SchoolIdPath:
      name: schoolId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StudentIdPath:
      name: studentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SubscriptionIdPath:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CardIdPath:
      name: cardId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RelationshipIdPath:
      name: relationshipId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ParentIdPath:
      name: parentId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    EmployeeIdPath:
      name: employeeId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SubjectIdPath:
      name: subjectId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SessionId:
      name: sessionId
      in: query
      schema: { type: integer, minimum: 1 }
    TermIdPath:
      name: termId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    StatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum: [ACTIVE, INACTIVE, all]
    Search:
      name: search
      in: query
      schema:
        type: string
