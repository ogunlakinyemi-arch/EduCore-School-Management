    $ref: "./student-care-expansion.yaml#/paths/~1parent~1children~1{studentId}~1care-summary"
  /student/care-summary:
    $ref: "./student-care-expansion.yaml#/paths/~1student~1care-summary"
  /school/academics/promotions/batches:
    $ref: "./promotion-expansion.yaml#/paths/~1school~1academics~1promotions~1batches"
  /school/academics/promotions/batches/{batchId}:
    $ref: "./promotion-expansion.yaml#/paths/~1school~1academics~1promotions~1batches~1{batchId}"
  /school/academics/promotions/batches/{batchId}/history:
    $ref: "./promotion-expansion.yaml#/paths/~1school~1academics~1promotions~1batches~1{batchId}~1history"
  /school/academics/promotions/batches/{batchId}/students/{studentId}:
    $ref: "./promotion-expansion.yaml#/paths/~1school~1academics~1promotions~1batches~1{batchId}~1students~1{studentId}"
  /school/academics/promotions/batches/{batchId}/finalize:
    $ref: "./promotion-expansion.yaml#/paths/~1school~1academics~1promotions~1batches~1{batchId}~1finalize"
  /cards/{cardId}/preview:
    get:
      operationId: getOfficialCardPreview
      summary: Read-only raster preview of an existing official card
      description: Owner or the current School Admin only. No PDF, download, print or card-lifecycle permission is granted.
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
        - in: query
          name: schoolId
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        "200":
          description: Front and back PNG data images from the existing official renderer
          content:
            application/json:
              schema:
                type: object
                required: [frontImage, backImage]
                properties:
                  frontImage: { type: string }
                  backImage: { type: string }
        "403":
          description: Role or school does not permit preview
        "404":
          description: No current card identity in this school
        "409":
          description: Card is unassigned or revoked
  /cards/{cardId}/printable:
    get:
      operationId: downloadPrintableNfcCard
      tags: [cards]
      summary: Download the existing assigned Teacher, Staff or Student NFC card as a front-and-back CR80 PDF
      description: >
        Read-only download for the existing active Platform Owner card-management permission.
        Requires the card's school to match schoolId and an eligible current assignment.
        Teachers and Staff may print after assignment, before the separate NFC activation step.
        Printing never creates or changes a person, card, UID or assignment. Student cards
        contain permanent identification only, not class, section, session or term.
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
        - in: query
          name: schoolId
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        "200":
          description: Two print-ready CR80 landscape pages, front followed by back
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { description: Invalid card or school identifier }
        "401": { description: Authentication required }
        "403": { description: Existing Platform Owner card-management permission required }
        "404": { description: Card not found in the requested school }
        "409": { description: "Card has no eligible current assignment or is locked, lost or revoked" }
        "422": { description: Current person type is not supported or permanent identification is missing }
  /activation/schools:
    get:
      operationId: listActivationSchools
      tags: [platform]
      summary: List schools available to the authenticated Platform Owner or Device Activation Officer
      responses:
        "200":
          description: Platform Owners receive all schools; officers receive only granted schools with a matching active company employee record
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ActivationSchool" } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /activation/schools/{schoolId}/devices:
    get:
      operationId: listActivationDevices
      tags: [platform]
      summary: List active NFC and HYBRID devices bound to an authorized school
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Authorized-school activation devices only
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ActivationDevice" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /activation/schools/{schoolId}/students:
    get:
      operationId: searchActivationStudents
      tags: [platform]
      summary: Search students in an authorized school for card activation
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Minimal student identity information for card assignment
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ActivationStudent" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /activation/schools/{schoolId}/history:
    get:
      operationId: listActivationHistory
      tags: [platform]
      summary: List NFC card activation history for an authorized school
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Recent school-scoped card history and device metadata
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ActivationHistory" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /activation/schools/{schoolId}/assign:
    post:
      operationId: assignActivationCard
      tags: [platform]
      summary: Activate an unassigned NFC card for a same-school student
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivationAssignmentInput" }
      responses:
        "201":
          description: Persisted active card assignment with current student and device details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationAssignment" }
        "400": { description: Invalid assignment input }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Card UID is unavailable or student already has an active card }
  /activation/schools/{schoolId}/students/{studentId}/e-id:
    get:
      operationId: getActivationStudentEId
      tags: [platform]
      summary: Get the student's current E-ID data using the latest active NFC card
      parameters:
        - name: schoolId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: studentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Fresh school, student, photo, and active-card data for E-ID preview/printing
          content:
