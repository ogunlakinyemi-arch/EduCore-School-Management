      operationId: listSchoolAdministratorInvitations
      tags: [schools]
      summary: List School Administrator invitations and active memberships for a school
      description: Platform Owner only. Invitation tokens are never returned.
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
      responses:
        "200":
          description: School-scoped School Administrator invitation history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAdministratorInvitationList" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /schools/{schoolId}/invitations/{invitationId}:
    patch:
      operationId: editSchoolAdministratorInvitation
      tags: [schools]
      summary: Replace a pending School Administrator invitation with a corrected email
      description: Platform Owner only. A pending or expired invitation may be replaced; the previous claim is invalidated.
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
        - name: invitationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100, pattern: "^[A-Za-z0-9_-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolAdministratorInvitationEmailUpdate" }
      responses:
        "201":
          description: Replacement invitation request accepted; inbox delivery is unverified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAdministratorInvitationReplacement" }
        "400": { description: Invalid replacement email }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Invitation is no longer eligible for replacement }
        "503": { description: Invitation replacement could not be safely completed }
  /schools/{schoolId}/invitations/{invitationId}/resend:
    post:
      operationId: resendSchoolAdministratorInvitation
      tags: [schools]
      summary: Resend a School Administrator invitation
      description: Platform Owner only. Supersedes the existing invitation and sends a replacement to the same email.
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
        - name: invitationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "201":
          description: Replacement invitation request accepted; inbox delivery is unverified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAdministratorInvitationReplacement" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Invitation is no longer eligible for replacement }
        "503": { description: Invitation replacement could not be safely completed }
  /schools/{schoolId}/users/invitations:
    get:
      operationId: listSchoolUserInvitations
      tags: [users]
      summary: List eligible pending school-user invitations for the active School Admin
      description: School Admin of the selected tenant only. Platform Owners are read-only here. Accepted, registered and superseded identities are omitted.
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
      responses:
        "200":
          description: Current pending and expired invitations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolUserInvitationList" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: Provider invitation state cannot be safely determined }
  /schools/{schoolId}/users/invitations/{invitationId}:
    patch:
      operationId: editSchoolUserInvitation
      tags: [users]
      summary: Replace only the selected school-user invitation with a corrected email
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
        - name: invitationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100, pattern: "^[A-Za-z0-9_-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolAdministratorInvitationEmailUpdate" }
      responses:
        "201":
          description: Replacement request accepted; delivery remains unverified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolUserInvitationReplacement" }
        "400": { description: Invalid replacement email }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Selected invitation is ineligible, stale or already being replaced" }
        "503": { description: Provider or commit result requires reconciliation before another attempt }
  /schools/{schoolId}/users/invitations/{invitationId}/resend:
    post:
      operationId: resendSchoolUserInvitation
      tags: [users]
      summary: Reissue exactly one selected school-user invitation to its current email
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
        - name: invitationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "201":
          description: Replacement request accepted; delivery remains unverified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolUserInvitationReplacement" }
        "400": { description: Use PATCH rather than resend to change an email }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Selected invitation is ineligible, stale or already being replaced" }
        "503": { description: Provider or commit result requires reconciliation before another attempt }
  /schools/{schoolId}/invitations/{invitationId}/reconcile:
    post:
      operationId: reconcileSchoolAdministratorInvitation
      tags: [schools]
      summary: Reconcile one unresolved School Administrator replacement without sending another invitation
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
        - name: invitationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: Existing notification reconciled or a definitely unsent staged request safely resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolInvitationRecoveryResult" }
        "202":
          description: Provider outcome remains unresolved; no new invitation sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolInvitationRecovery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /schools/{schoolId}/users/invitations/{invitationId}/reconcile:
    post:
      operationId: reconcileSchoolUserInvitation
      tags: [users]
      summary: Reconcile one unresolved school-user replacement without sending another invitation
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
        - name: invitationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: Existing notification reconciled or a definitely unsent staged request safely resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolInvitationRecoveryResult" }
        "202":
          description: Provider outcome remains unresolved; no new invitation sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolInvitationRecovery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
