        previousSchool: { type: ["string", "null"] }
        medicalInformation: { type: ["string", "null"] }
        emergencyContactName: { type: ["string", "null"] }
        emergencyContactPhone: { type: ["string", "null"] }
        currentClassId: { type: ["integer", "null"] }
        currentSessionId: { type: ["integer", "null"] }
        currentTermId: { type: ["integer", "null"] }
        createdAt: { type: ["string", "null"], format: date-time }
        updatedAt: { type: ["string", "null"], format: date-time }
        gender:
