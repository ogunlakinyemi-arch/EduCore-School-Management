          application/json:
            schema: { $ref: "#/components/schemas/SchoolUserInvitationInput" }
      responses:
        "201":
          description: Existing account granted a school membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAdministratorResult" }
        "202":
          description: Clerk accepted the invitation request; inbox delivery is unverified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAdministratorResult" }
