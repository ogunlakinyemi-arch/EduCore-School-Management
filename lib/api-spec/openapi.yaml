openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Multi-tenant EduPulse school management API
servers:
  - url: /api
    description: Base API path
security:
  - ClerkAuth: []
tags:
  - name: health
  - name: identity
  - name: parent-portal
  - name: users
  - name: dashboard
  - name: schools
  - name: students
  - name: parents
  - name: classes
  - name: subscriptions
  - name: cards
  - name: audit
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [identity]
      summary: Get the authenticated EduPulse user
      responses:
        "200":
          description: Current user and active role assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/roles:
    get:
      operationId: getCurrentUserRoles
      tags: [identity]
      summary: Get active role assignments
      responses:
        "200":
          description: Active roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoleAssignment" }
  /me/schools:
    get:
      operationId: getCurrentUserSchools
      tags: [identity]
      summary: Get schools available to the authenticated user
      responses:
        "200":
          description: Authorized schools
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuthorizedSchool" }
  /me/authorized-context:
    get:
      operationId: getAuthorizedContext
      tags: [identity]
      summary: Get the authenticated authorization context
      responses:
        "200":
          description: Authorization context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizedContext" }
  /parent/profile:
    get:
      operationId: getParentProfile
      tags: [parent-portal]
      summary: Get the authenticated parent's profile
      responses:
        "200":
          description: Parent profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
  /parent/children:
    get:
      operationId: getParentChildren
      tags: [parent-portal]
      summary: List children linked to the authenticated parent
      responses:
        "200":
          description: Linked children
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ParentChild" }
  /parent/children/{studentId}:
    get:
      operationId: getParentChild
      tags: [parent-portal]
      summary: Get one child linked to the authenticated parent
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
      responses:
        "200":
          description: Authorized child profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentChild" }
        "404": { $ref: "#/components/responses/NotFound" }
  /parent-student-relationships:
    get:
      operationId: listParentStudentRelationships
      tags: [parent-portal]
      summary: List authorized parent-student relationships
      parameters:
        - name: schoolId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Relationships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ParentStudentRelationship" }
    post:
      operationId: createParentStudentRelationship
      tags: [parent-portal]
      summary: Link a parent and student in an authorized school
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentStudentRelationshipInput" }
      responses:
        "201":
          description: Relationship created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentRelationship" }
  /parent-student-relationships/{relationshipId}:
    patch:
      operationId: updateParentStudentRelationship
      tags: [parent-portal]
      summary: Update an authorized parent-student relationship
      parameters:
        - $ref: "#/components/parameters/RelationshipIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentStudentRelationshipUpdate" }
      responses:
        "200":
          description: Relationship updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentStudentRelationship" }
    delete:
      operationId: deactivateParentStudentRelationship
      tags: [parent-portal]
      summary: Deactivate a relationship while preserving history
      parameters:
        - $ref: "#/components/parameters/RelationshipIdPath"
      responses:
        "204": { description: Relationship deactivated }
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List EduPulse users for platform administration
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppUser" }
  /platform-users:
    post:
      operationId: createPlatformMembership
      tags: [users]
      summary: Assign an authorized platform role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformMembershipInput" }
      responses:
        "201":
          description: Platform membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleAssignment" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /school-users:
    get:
      operationId: listSchoolUsers
      tags: [users]
      summary: List users in an authorized school
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: School users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchoolUser" }
    post:
      operationId: createSchoolMembership
      tags: [users]
      summary: Add or reactivate an authorized school membership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolMembershipInput" }
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleAssignment" }
  /dashboard/platform:
    get:
      operationId: getPlatformDashboard
      tags: [dashboard]
      summary: Platform owner dashboard
      responses:
        "200":
          description: Platform dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDashboard"
  /dashboard/school:
    get:
      operationId: getSchoolDashboard
      tags: [dashboard]
      summary: School operations dashboard
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: School dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolDashboard"
  /schools:
    get:
      operationId: listSchools
      tags: [schools]
      summary: List schools
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, inactive, all]
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Schools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/School"
    post:
      operationId: createSchool
      tags: [schools]
      summary: Create school
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolInput"
      responses:
        "201":
          description: Created school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"
  /schools/{schoolId}:
    get:
      operationId: getSchool
      tags: [schools]
      summary: Get school
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
      responses:
        "200":
          description: School
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"
    patch:
      operationId: updateSchool
      tags: [schools]
      summary: Update school
      parameters:
        - $ref: "#/components/parameters/SchoolIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolUpdate"
      responses:
        "200":
          description: Updated school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students in a tenant
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, all]
        - name: classId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a student
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
  /students/{studentId}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a student
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update a student
      parameters:
        - $ref: "#/components/parameters/StudentIdPath"
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
  /parents:
    get:
      operationId: listParents
      tags: [parents]
      summary: List parents
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Parents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Parent"
    post:
      operationId: createParent
      tags: [parents]
      summary: Create a parent
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentInput"
      responses:
        "201":
          description: Created parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parent"
  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List classes and sections
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchoolClass"
    post:
      operationId: createClass
      tags: [classes]
      summary: Create a class
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "201":
          description: Created class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolClass"
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List subscription ledger records
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, pending, expired, failed, all]
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a pending subscription payment
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Pending subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
  /subscriptions/{subscriptionId}/verify:
    post:
      operationId: verifySubscription
      tags: [subscriptions]
      summary: Verify a provider payment and activate entitlement
      parameters:
        - $ref: "#/components/parameters/SubscriptionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentVerificationInput"
      responses:
        "200":
          description: Verified subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
  /cards:
    get:
      operationId: listCards
      tags: [cards]
      summary: List NFC cards
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, locked, unassigned, lost, all]
      responses:
        "200":
          description: NFC cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NfcCard"
    post:
      operationId: registerCard
      tags: [cards]
      summary: Register an NFC card
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardInput"
      responses:
        "201":
          description: Registered card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfcCard"
  /cards/{cardId}/status:
    patch:
      operationId: updateCardStatus
      tags: [cards]
      summary: Change a card state
      parameters:
        - $ref: "#/components/parameters/CardIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardStatusInput"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NfcCard"
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit activity
      parameters:
        - name: schoolId
          in: query
          schema:
            type: integer
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
components:
  securitySchemes:
    ClerkAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
      description: Clerk session cookie or bearer token validated by the API
  responses:
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource not found or outside authorized visibility
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  parameters:
    SchoolId:
      name: schoolId
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    SchoolIdPath:
      name: schoolId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StudentIdPath:
      name: studentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SubscriptionIdPath:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CardIdPath:
      name: cardId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RelationshipIdPath:
      name: relationshipId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Search:
      name: search
      in: query
      schema:
        type: string
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    PlatformDashboard:
      type: object
      required: [totalSchools, activeSchools, suspendedSchools, totalStudents, activeSubscriptions, pendingPayments, revenue, schoolAllocation, edupulseAllocation, activeCards, lockedCards, recentActivity]
      properties:
        totalSchools: { type: integer }
        activeSchools: { type: integer }
        suspendedSchools: { type: integer }
        totalStudents: { type: integer }
        activeSubscriptions: { type: integer }
        pendingPayments: { type: integer }
        revenue: { type: number }
        schoolAllocation: { type: number }
        edupulseAllocation: { type: number }
        activeCards: { type: integer }
        lockedCards: { type: integer }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
    SchoolDashboard:
      type: object
      required: [school, totalStudents, activeStudents, unpaidStudents, pendingPayments, activeCards, lockedCards, recentActivity]
      properties:
        school: { $ref: "#/components/schemas/School" }
        totalStudents: { type: integer }
        activeStudents: { type: integer }
        unpaidStudents: { type: integer }
        attendanceRate: { type: ["number", "null"] }
        pendingPayments: { type: integer }
        activeCards: { type: integer }
        lockedCards: { type: integer }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
    School:
      type: object
      required: [id, code, name, city, state, status, studentCount, staffCount, subscriptionStatus, createdAt]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        city: { type: string }
        state: { type: string }
        status:
          type: string
          enum: [active, suspended, inactive]
        studentCount: { type: integer }
        staffCount: { type: integer }
        subscriptionStatus:
          type: string
          enum: [active, attention, expired]
        createdAt: { type: string }
    SchoolInput:
      type: object
      required: [name, city, state]
      properties:
        name: { type: string, minLength: 2 }
        city: { type: string, minLength: 2 }
        state: { type: string, minLength: 2 }
        status:
          type: string
          enum: [active, suspended, inactive]
    SchoolUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        city: { type: string, minLength: 2 }
        state: { type: string, minLength: 2 }
        status:
          type: string
          enum: [active, suspended, inactive]
    Student:
      type: object
      required: [id, schoolId, admissionNo, firstName, lastName, gender, className, section, status, subscriptionStatus, cardStatus, joinedAt]
      properties:
        id: { type: integer }
        schoolId: { type: integer }
        admissionNo: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        gender:
          type: string
          enum: [female, male, other]
        className: { type: string }
        section: { type: string }
        parentName: { type: ["string", "null"] }
        parentPhone: { type: ["string", "null"] }
        status:
          type: string
          enum: [active, archived]
        subscriptionStatus:
          type: string
          enum: [active, unpaid, pending, expired]
        cardStatus:
          type: string
          enum: [active, locked, unassigned, lost]
        joinedAt: { type: string }
    StudentInput:
      type: object
      required: [admissionNo, firstName, lastName, gender, className, section]
      properties:
        admissionNo: { type: string, minLength: 1 }
        firstName: { type: string, minLength: 2 }
        lastName: { type: string, minLength: 2 }
        gender:
          type: string
          enum: [female, male, other]
        className: { type: string, minLength: 1 }
        section: { type: string, minLength: 1 }
        parentName: { type: string }
        parentPhone: { type: string }
    StudentUpdate:
      type: object
      properties:
        firstName: { type: string, minLength: 2 }
        lastName: { type: string, minLength: 2 }
        className: { type: string }
        section: { type: string }
        status:
          type: string
          enum: [active, archived]
    Parent:
      type: object
      required: [id, schoolId, name, email, phone, childrenCount, activeChildren]
      properties:
        id: { type: integer }
        schoolId: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        childrenCount: { type: integer }
        activeChildren: { type: integer }
    RoleAssignment:
      type: object
      required: [id, role, status]
      properties:
        id: { type: integer }
        role:
          type: string
          enum: [PLATFORM_OWNER, SCHOOL_ADMIN, TEACHER, ACCOUNTANT, PARENT, STUDENT, STAFF]
        schoolId: { type: ["integer", "null"] }
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    CurrentUser:
      type: object
      required: [id, clerkUserId, email, status, name, roles]
      properties:
        id: { type: integer }
        clerkUserId: { type: string }
        email: { type: string, format: email }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        name: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
    AuthorizedSchool:
      type: object
      required: [id, schoolId, role, status, code, name, city, state]
      properties:
        id: { type: integer }
        schoolId: { type: integer }
        role: { type: string }
        status: { type: string }
        code: { type: string }
        name: { type: string }
        city: { type: string }
        state: { type: string }
    AuthorizedContext:
      type: object
      required: [user, isPlatformOwner, roles]
      properties:
        user:
          type: object
          required: [id, name, email, status]
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
            status: { type: string }
        isPlatformOwner: { type: boolean }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
    ParentProfile:
      type: object
      required: [id, schoolId, name, email, phone]
      properties:
        id: { type: integer }
        schoolId: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
    ParentChild:
      type: object
      required: [id, schoolId, admissionNo, firstName, lastName, className, section, status, schoolName]
      properties:
        id: { type: integer }
        schoolId: { type: integer }
        admissionNo: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        gender: { type: string }
        className: { type: string }
        section: { type: string }
        status: { type: string }
        schoolCode: { type: string }
        schoolName: { type: string }
        city: { type: string }
        state: { type: string }
        relationshipType: { type: string }
        isPrimaryGuardian: { type: boolean }
        isEmergencyContact: { type: boolean }
        contactPriority: { type: integer }
    ParentStudentRelationship:
      type: object
      required: [id, parentId, studentId, relationshipType, isPrimaryGuardian, isEmergencyContact, contactPriority, status]
      properties:
        id: { type: integer }
        parentId: { type: integer }
        studentId: { type: integer }
        relationshipType: { type: string }
