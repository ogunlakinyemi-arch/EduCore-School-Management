openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Multi-tenant Yemait EduCore school management API
servers:
  - url: /api
    description: Base API path
security:
  - ClerkAuth: []
tags:
  - name: health
  - name: identity
  - name: parent-portal
  - name: users
  - name: dashboard
  - name: schools
  - name: students
  - name: parents
  - name: classes
  - name: academics
  - name: employees
  - name: subjects
  - name: subscriptions
  - name: cards
  - name: audit
  - name: platform-partners
  - name: partner
  - name: partner-onboarding
  - name: platform
  - name: attendance
  - name: finance
paths:
  /school/finance/settings:
    get:
      operationId: getFinanceSettings
      tags: [finance]
      summary: Get school payment controls and school-admin-approved bank transfer details
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: School-scoped financial settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceSettings" }
    patch:
      operationId: updateFinanceSettings
      tags: [finance]
      summary: Configure school payment controls and approved manual bank-transfer details
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceSettingsUpdate" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceSettings" }
  /me/finance/payment-notifications:
    get:
      operationId: listMyFeePaymentNotifications
      tags: [finance]
      summary: List finance notifications currently linked to the authenticated recipient
      parameters:
        - name: schoolId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Recipient-only IN_APP notifications with minimal receipt and payment context
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeePaymentNotification" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/finance/invoice-notifications:
    get:
      operationId: listMyFeeInvoiceNotifications
      tags: [finance]
      summary: List invoice-generated notifications currently linked to the authenticated recipient
      parameters:
        - name: schoolId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Recipient-only invoice notices without payment or receipt context
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeeInvoiceNotification" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/finance/invoice-notifications/{notificationId}/read:
    patch:
      operationId: markMyFeeInvoiceNotificationRead
      tags: [finance]
      summary: Mark a currently authorized invoice notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The safe invoice notification representation after marking it read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeInvoiceNotification" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/finance/payment-notifications/{notificationId}/read:
    patch:
      operationId: markMyFeePaymentNotificationRead
      tags: [finance]
      summary: Mark a currently authorized finance notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The safe notification representation after marking it read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeePaymentNotification" }
        "404": { $ref: "#/components/responses/NotFound" }
  /school/finance/provider-reconciliation:
    get:
      operationId: listFeeProviderReconciliationEvents
      tags: [finance]
      summary: List signed provider events requiring school finance reconciliation
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: Reconciliation events scoped to the authorized school
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeeProviderReconciliationEvent" }
  /school/finance/provider-reconciliation/{eventId}/retry:
    post:
      operationId: retryFeeProviderReconciliationEvent
      tags: [finance]
      summary: Reverify a signed provider transaction for a school payment
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Provider event was reconciled or remains pending review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeProviderReconciliationRetry" }
  /school/finance/provider-checkouts/{paymentId}/reconcile:
    post:
      operationId: reconcileFeeProviderCheckout
      tags: [finance]
      summary: Independently verify an unresolved checkout and safely release it only after terminal failure
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Checkout was independently verified, settled, or released after terminal failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeProviderCheckoutReconciliation" }
        "202":
          description: Provider status is pending or cannot yet be independently established; reservation remains active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeProviderCheckoutReconciliation" }
        "409":
          description: Checkout is already being reconciled or is not eligible for this operation
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Provider status credentials are unavailable }
  /parent/fees/invoices/{invoiceId}/bank-details:
    get:
      operationId: getParentFeeInvoiceBankDetails
      tags: [finance, parent-portal]
      summary: Get enabled school transfer details for a payable invoice linked to the authenticated parent
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Enabled bank details or an explicit unavailable result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentInvoiceBankDetails" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Invoice is not payable }
  /parent/fees/invoices/{invoiceId}/payment-methods:
    get:
      operationId: getParentFeeInvoicePaymentMethods
      tags: [finance, parent-portal]
      summary: List payment methods currently usable for a linked parent invoice
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Only configured, school-enabled payment methods usable for this payable invoice
          content:
            application/json:
              schema:
                type: array
                items: { type: string, enum: [BANK_TRANSFER, PAYSTACK, FLUTTERWAVE] }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Invoice is not payable }
  /parent/fees/invoices/{invoiceId}/checkout-policy:
    get:
      operationId: getParentFeeInvoiceCheckoutPolicy
      tags: [finance, parent-portal]
      summary: Read the linked parent's outstanding invoice amount and partial-payment policy
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Safe checkout amount policy without payment or school secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentFeeInvoiceCheckoutPolicy" }
        "404": { $ref: "#/components/responses/NotFound" }
  /parent/fees/invoices/{invoiceId}/providers/{provider}/initialize:
    post:
      operationId: initializeFeeProviderPayment
      tags: [finance, parent-portal]
      summary: Create an idempotent hosted checkout for a linked parent and payable invoice
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [PAYSTACK, FLUTTERWAVE, REMITA] }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 120, pattern: "^[A-Za-z0-9._:-]+$" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeProviderCheckoutInitializeInput" }
      responses:
        "201":
          description: Hosted checkout initialized; redirects are informational only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeProviderCheckout" }
        "200":
          description: Idempotent replay of an existing checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeProviderCheckout" }
        "202":
          description: Existing initialization is active or its outcome is uncertain and requires independent provider reconciliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeProviderCheckoutProcessing" }
        "400": { description: Amount is invalid or partial payments are disabled }
        "409":
          description: Provider disabled, invoice not payable, or idempotency conflict
        "503":
          description: Test provider credentials or callback URL unavailable
  /finance/provider-webhooks/{provider}:
    post:
      operationId: receiveFeeProviderWebhook
      tags: [finance]
      summary: Public raw-body payment provider callback
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [paystack, flutterwave] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Verified, safely ignored duplicate, or recorded no-credit provider event
        "202":
          description: Authenticated provider event retained for reconciliation
        "400":
          description: Invalid or oversized raw body
        "401":
          description: Invalid provider signature
        "503":
          description: Provider test credentials unavailable
  /school/finance/categories:
    get:
      operationId: listFeeCategories
      tags: [finance]
      summary: List fee categories for an authorized school
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: Fee categories
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FeeCategory" } }
    post:
      operationId: createFeeCategory
      tags: [finance]
      summary: Create a tenant-scoped fee category
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeCategoryInput" }
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeCategory" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /school/finance/categories/{categoryId}:
    patch:
      operationId: updateFeeCategory
      tags: [finance]
      summary: Update a category without rewriting historical invoice snapshots
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeCategoryUpdate" }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeCategory" }
        "404": { $ref: "#/components/responses/NotFound" }
  /school/finance/structures:
    get:
      operationId: listFeeStructures
      tags: [finance]
      summary: List versioned fee structures for an authorized school
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: Fee structures
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FeeStructure" } }
    post:
      operationId: createFeeStructure
      tags: [finance]
      summary: Create a draft fee structure and its lines
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeStructureInput" }
      responses:
        "201":
          description: Draft structure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeStructure" }
  /school/finance/structures/{structureId}/publish:
    post:
      operationId: publishFeeStructure
      tags: [finance]
      summary: Publish a draft structure without changing historical versions
      parameters:
        - name: structureId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Published structure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeStructure" }
        "404": { $ref: "#/components/responses/NotFound" }
  /school/finance/assignments:
    post:
      operationId: assignFeeStructure
      tags: [finance]
      summary: Create a student invoice from a published structure idempotently
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeAssignmentInput" }
      responses:
        "201":
          description: Invoice created or returned for an existing assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeInvoice" }
        "409": { description: Structure already used or assignment conflicts }
  /school/finance/bulk-assignments:
    post:
      operationId: bulkAssignFeeStructure
      tags: [finance]
      summary: Assign a published structure to all active matching students with per-student duplicate reasons
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeBulkAssignmentInput" }
      responses:
        "200":
          description: Per-student invoice creation and duplicate skip results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeBulkAssignmentResult" }
  /school/finance/payments/{paymentId}/refunds:
    post:
      operationId: requestFeeRefund
      tags: [finance]
      summary: Request a refund against a verified payment; funds are not changed until separately approved
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/SchoolId"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeRefundInput" }
      responses:
        "201":
          description: Pending refund request, not an external refund success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeRefund" }
        "409": { description: Refund amount exceeds refundable balance or key conflicts }
  /school/finance/refunds:
    get:
      operationId: listSchoolFeeRefunds
      tags: [finance]
      summary: Recover school refund requests with safe invoice, student, payment, and review evidence fields
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED, ALL], default: PENDING }
      responses:
        "200":
          description: Refund ledger entries visible to an admin or accountant assigned to this exact school
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SchoolFeeRefund" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /school/finance/refunds/{refundId}:
    get:
      operationId: getSchoolFeeRefund
      tags: [finance]
      summary: Read one school-scoped refund ledger entry and review evidence
      parameters:
        - name: refundId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Refund with safe linked invoice, student, and payment details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolFeeRefund" }
        "404": { $ref: "#/components/responses/NotFound" }
  /school/finance/refunds/{refundId}/approve:
    post:
      operationId: approveFeeRefund
      tags: [finance]
      summary: Approve an internal refund ledger adjustment with evidence; does not assert provider payout
      parameters:
        - name: refundId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeRefundApprovalInput" }
      responses:
        "200":
          description: Approved internal refund ledger record; original payment and receipt remain in history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeRefund" }
        "409": { description: Refund is not pending or exceeds refundable balance }
  /school/finance/reports:
    get:
      operationId: getSchoolFinanceReport
      tags: [finance]
      summary: School-scoped financial totals and grouped financial report data
      description: >-
        Student and method filters are school-scoped. For payments reports, and totalCollectedMinor in
        provider-reconciliation reports, from/to select payment collections using verification time (or creation
        time while unverified); totalCollectedMinor is net of approved internal refunds and reversals for that period.
        totalBilledMinor and totalOutstandingMinor remain lifetime totals for the filtered invoice cohort and are not
        limited to the payment date range. Provider-reconciliation rows are checkout-session and webhook-event
        records; their date range uses checkout creation or webhook receipt time.
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: reportType
          in: query
          schema: { type: string, enum: [summary, payments, outstanding, category, class, term, adjustment, refund, provider-reconciliation], default: summary }
        - name: sessionId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: termId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: classId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: section
          in: query
          schema: { type: string, maxLength: 100 }
        - name: categoryId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: studentId
          in: query
          schema: { type: integer, minimum: 1 }
          description: Restrict invoice and payment data to this student within the authorized school.
        - name: method
          in: query
          schema: { type: string, enum: [BANK_TRANSFER, REMITA, FLUTTERWAVE, PAYSTACK] }
          description: Payment method filter; distinct from provider.
        - name: status
          in: query
          schema: { type: string }
        - name: provider
          in: query
          schema: { type: string, enum: [MANUAL_BANK_TRANSFER, REMITA, FLUTTERWAVE, PAYSTACK] }
          description: Payment provider filter; distinct from the payment method.
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: School-scoped totals and grouped or detailed student, invoice, and payment report rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceReport" }
  /school/finance/invoices:
    get:
      operationId: listFeeInvoices
      tags: [finance]
      summary: List invoices within an authorized school
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: status
          in: query
          schema: { type: string, enum: [UNPAID, PARTIALLY_PAID, PAID, OVERDUE, WAIVED, CANCELLED] }
        - name: studentId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Tenant-scoped invoice summaries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FeeInvoice" } }
  /parent/fees/invoices:
    get:
      operationId: listParentFeeInvoices
      tags: [finance, parent-portal]
      summary: List fee invoices only for children linked to the authenticated parent
      responses:
        "200":
          description: Parent's linked-child invoices
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FeeInvoice" } }
  /student/fees/invoices:
    get:
      operationId: listStudentFeeInvoices
      tags: [finance]
      summary: Read fee invoices for the authenticated student's own record only
      responses:
        "200":
          description: Own invoices
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FeeInvoice" } }
  /school/finance/payments:
    get:
      operationId: listSchoolFinancePayments
      tags: [finance]
      summary: List safe payment records within an authorized school
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, PROCESSING, VERIFIED, FAILED, REJECTED, CANCELLED, REVERSED, REFUNDED] }
        - name: studentId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: School-scoped payments including transfer review fields
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FeePaymentHistory" } }
  /school/finance/payments/{paymentId}:
    get:
      operationId: getSchoolFinancePayment
      tags: [finance]
      summary: Read one safe payment record inside an authorized school
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: School-scoped payment and manual transfer details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeePaymentHistory" }
        "404": { $ref: "#/components/responses/NotFound" }
  /parent/fees/payments:
    get:
      operationId: listParentFeePayments
      tags: [finance, parent-portal]
      summary: List payment history only for the authenticated parent's linked children
      responses:
        "200":
          description: Safe payment history for linked children
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FeePaymentHistory" } }
  /student/fees/payments:
    get:
      operationId: listStudentFeePayments
      tags: [finance]
      summary: List payment history only for the authenticated student's record
      responses:
        "200":
          description: Safe payment history for the authenticated student
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FeePaymentHistory" } }
  /parent/fees/invoices/{invoiceId}/bank-transfer:
    post:
      operationId: submitManualBankTransfer
      tags: [finance, parent-portal]
      summary: Submit a manual bank transfer as pending; it is never automatically counted as paid
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankTransferInput" }
      responses:
        "201":
          description: Pending transfer submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeePayment" }
        "404": { $ref: "#/components/responses/NotFound" }
  /school/finance/payments/{paymentId}/verify:
    post:
      operationId: verifyManualBankTransfer
      tags: [finance]
      summary: Accountant or School Admin verifies a submitted transfer transactionally
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeePaymentVerificationInput" }
      responses:
        "200":
          description: Verified payment and generated receipt reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeePaymentVerificationResult" }
        "409": { description: Payment is no longer pending or invoice would be overpaid }
  /school/finance/payments/{paymentId}/reject:
    post:
      operationId: rejectManualBankTransfer
      tags: [finance]
      summary: Reject a pending transfer with a recorded reason
      parameters:
