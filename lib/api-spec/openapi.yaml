components:
  securitySchemes:
    ClerkAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
      description: Clerk session cookie or bearer token validated by the API
    DeviceCredential:
      type: apiKey
      in: header
      name: X-Device-Credential
      description: Revocable device credential; the raw value is write-only and must never be logged or returned after rotation
  responses:
    ApiBadRequest:
      description: Invalid request or rejected school/device/student relationship
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource not found or outside authorized visibility
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  parameters:
    SchoolId:
      name: schoolId
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    SchoolIdPath:
      name: schoolId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StudentIdPath:
      name: studentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SubscriptionIdPath:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CardIdPath:
      name: cardId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RelationshipIdPath:
      name: relationshipId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ParentIdPath:
      name: parentId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    EmployeeIdPath:
      name: employeeId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SubjectIdPath:
      name: subjectId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SessionId:
      name: sessionId
      in: query
      schema: { type: integer, minimum: 1 }
    TermIdPath:
      name: termId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    StatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum: [ACTIVE, INACTIVE, all]
    Search:
      name: search
      in: query
      schema:
        type: string
    PartnerIdPath:
      name: partnerId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    InvitationTokenPath:
      name: invitationToken
      in: path
      required: true
      description: Opaque, single-use, high-entropy invitation token. Never a database identifier.
      schema:
        type: string
        minLength: 32
        pattern: "^[A-Za-z0-9_-]{32,}$"
    ConflictIdPath:
      name: conflictId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RuleIdPath:
      name: ruleId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PayoutIdPath:
      name: payoutId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    CommissionIdPath:
      name: commissionId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    PlatformOwnerBootstrapStatus:
      type: object
      required: [available, configured]
      properties:
        available: { type: boolean }
        configured: { type: boolean }
    PlatformOwnerBootstrapInput:
      type: object
      required: [setupKey, fullName, email, phone, password]
      properties:
        setupKey: { type: string, minLength: 16, maxLength: 256 }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 8, maxLength: 25 }
        password: { type: string, minLength: 15, maxLength: 256 }
    PlatformOwnerBootstrapResult:
      type: object
      required: [created, signInPath]
      properties:
        created: { type: boolean, const: true }
        signInPath: { type: string }
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    PeopleImportClasses:
      type: object
      required: [classes]
      properties:
        classes:
          type: array
          items: { $ref: "#/components/schemas/PeopleImportClass" }
    PeopleImportClass:
      type: object
      required: [id, name, section]
      properties:
        id: { type: integer }
        name: { type: string }
        section: { type: string }
    PeopleImportUpload:
      type: object
      required: [file, kind]
      properties:
        file: { type: string, format: binary }
        kind: { type: string, enum: [students, parents, teachers, staff] }
    PeopleImportPreviewUpload:
      type: object
      required: [file, kind, mapping, classMapping]
      properties:
        file: { type: string, format: binary }
        kind: { type: string, enum: [students, parents, teachers, staff] }
        mapping: { type: string, description: JSON object mapping canonical fields to file headers }
        classMapping: { type: string, description: JSON object mapping imported class values to existing class IDs }
    PeopleImportInspection:
      type: object
      required: [filename, detectedType, kind, columns, classes]
      properties:
        filename: { type: string }
        detectedType: { type: string, enum: [csv, xlsx, pdf] }
        kind: { type: string, enum: [students, parents, teachers, staff] }
        columns: { type: array, items: { type: string } }
        classes:
          type: array
          items: { $ref: "#/components/schemas/PeopleImportClass" }
    PeopleImportIssue:
      type: object
      required: [message]
      properties:
        field: { type: string }
        message: { type: string }
    PeopleImportRow:
      type: object
      required: [index, sourceRow, values, status, errors, warnings]
      properties:
        index: { type: integer }
        sourceRow: { type: integer }
        values: { type: object, additionalProperties: true }
        status: { type: string, enum: [READY, INVALID, DUPLICATE, POTENTIAL_DUPLICATE] }
        errors:
          type: array
          items: { $ref: "#/components/schemas/PeopleImportIssue" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/PeopleImportIssue" }
    PeopleImportPreview:
      type: object
      required: [previewId, filename, detectedType, kind, detected, counts, columns, classes, classValues, rows]
      properties:
        previewId: { type: string }
        filename: { type: string }
        detectedType: { type: string, enum: [csv, xlsx, pdf] }
        kind: { type: string, enum: [students, parents, teachers, staff] }
        detected: { type: integer }
        counts:
          type: object
          properties:
            ready: { type: integer }
            potentialDuplicates: { type: integer }
            duplicates: { type: integer }
            invalid: { type: integer }
        columns: { type: array, items: { type: string } }
        classes:
          type: array
          items: { $ref: "#/components/schemas/PeopleImportClass" }
        classValues: { type: array, items: { type: string } }
        rows:
          type: array
          items: { $ref: "#/components/schemas/PeopleImportRow" }
    PeopleImportConfirmationInput:
      type: object
      required: [previewId, selectedRows]
      properties:
        previewId: { type: string }
        selectedRows: { type: array, items: { type: integer } }
        includePotentialDuplicates: { type: boolean }
    PeopleImportResult:
      type: object
      required: [detected, imported, skipped, failed, results]
      properties:
        detected: { type: integer }
        imported: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              sourceRow: { type: integer }
              status: { type: string, enum: [IMPORTED, FAILED, SKIPPED] }
              recordId: { type: integer }
              message: { type: string }
    OwnerSchool:
      type: object
      required: [id, code, name, status, studentCount, activeStudentCount, teacherCount, staffCount, employeeCount, accountantCount, parentCount, classCount, administrators, subscriptionStatus]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        studentCount: { type: integer }
        activeStudentCount: { type: integer }
        teacherCount: { type: integer }
        staffCount: { type: integer }
        employeeCount: { type: integer }
        accountantCount: { type: integer }
        parentCount: { type: integer }
        classCount: { type: integer }
        administrators:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              email: { type: string }
              status: { type: string }
        subscriptionStatus: { type: string }
        partnerReferral:
          type: ["object", "null"]
          properties:
            partnerId: { type: integer }
            partnerName: { type: string }
            source: { type: string }
            status: { type: string }
            referralLinkId: { type: ["integer", "null"] }
            registrationDate: { type: string, format: date-time }
    OwnerSchoolDirectory:
      type: object
      required: [schools, totals]
      properties:
        schools:
          type: array
          items: { $ref: "#/components/schemas/OwnerSchool" }
        totals:
          type: object
          required: [schoolCount, studentCount, activeStudentCount, teacherCount, staffCount, parentCount]
          properties:
            schoolCount: { type: integer }
            studentCount: { type: integer }
            activeStudentCount: { type: integer }
            teacherCount: { type: integer }
            staffCount: { type: integer }
            parentCount: { type: integer }
    OwnerSchoolOverview:
      allOf:
        - $ref: "#/components/schemas/OwnerSchool"
        - type: object
          properties:
            attendanceEventCount: { type: integer }
            resultCount: { type: integer }
            subscriptionCount: { type: integer }
            deviceCount: { type: integer }
            cardCount: { type: integer }
            activeCardCount: { type: integer }
            recentActivity:
              type: array
              items: { type: object, additionalProperties: true }
    PlatformDashboard:
      type: object
      required: [totalSchools, activeSchools, suspendedSchools, totalStudents, activeSubscriptions, pendingPayments, revenue, schoolAllocation, edupulseAllocation, activeCards, lockedCards, recentActivity]
      properties:
        totalSchools: { type: integer }
        activeSchools: { type: integer }
        suspendedSchools: { type: integer }
        totalStudents: { type: integer }
        activeSubscriptions: { type: integer }
        pendingPayments: { type: integer }
        revenue: { type: number }
        schoolAllocation: { type: number }
        edupulseAllocation: { type: number }
        activeCards: { type: integer }
        lockedCards: { type: integer }
        inactiveSchools: { type: integer }
        totalTeachers: { type: integer }
        totalParents: { type: integer }
        subscriptionSummary:
          type: object
          additionalProperties: { type: integer }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
    SchoolDashboard:
