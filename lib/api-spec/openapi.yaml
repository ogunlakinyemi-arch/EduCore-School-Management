components:
  securitySchemes:
    ClerkAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
      description: Clerk session cookie or bearer token validated by the API
    DeviceCredential:
      type: apiKey
      in: header
      name: X-Device-Credential
      description: Revocable device credential; the raw value is write-only and must never be logged or returned after rotation
  responses:
    ApiBadRequest:
      description: Invalid request or rejected school/device/student relationship
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
