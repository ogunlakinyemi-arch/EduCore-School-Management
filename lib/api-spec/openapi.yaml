          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: category
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CommunicationCategory" }
        - name: isRead
          in: query
          required: false
          schema: { type: boolean }
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean }
        - name: includeExpired
          in: query
          required: false
          schema: { type: boolean }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Own visible notifications and unread count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationNotificationInbox" }
