          application/json:
            schema: { $ref: "#/components/schemas/SchoolAdministratorInput" }
      responses:
        "201":
          description: Existing account granted School Administrator access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAdministratorResult" }
