        provider: { type: ["string", "null"], enum: [PAYSTACK, FLUTTERWAVE, REMITA, MANUAL_BANK_TRANSFER, null] }
        checkoutState: { type: ["string", "null"], enum: [INITIALIZING, READY, FAILED, SETTLED, RELEASED, null] }
        reconciliationStatus: { type: ["string", "null"], enum: [RECEIVED, VERIFIED, PENDING, FAILED, RECONCILIATION_REQUIRED, null] }
        signatureVerified: { type: ["boolean", "null"] }
        eventId: { type: ["string", "null"] }
        webhookTransactionId: { type: ["string", "null"] }
        verifiedTransactionId: { type: ["string", "null"] }
        providerReference: { type: ["string", "null"] }
        paymentStatus: { type: ["string", "null"] }
        eventDate: { type: ["string", "null"], format: date-time }
        reason: { type: ["string", "null"], description: Sanitized checkout failure or webhook reconciliation reason; never includes provider credentials or raw payload data. }
    FinanceReport:
      type: object
      required: [schoolId, reportType, totalBilledMinor, totalCollectedMinor, totalOutstandingMinor, totalDiscountMinor, totalWaiverMinor, totalRefundedMinor, totalReversedMinor, rows]
      properties:
        schoolId: { type: integer }
        reportType: { type: string }
        totalBilledMinor: { type: integer }
        totalCollectedMinor: { type: integer }
        totalOutstandingMinor: { type: integer }
        totalDiscountMinor: { type: integer }
        totalWaiverMinor: { type: integer }
        totalRefundedMinor: { type: integer }
        totalReversedMinor: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/FinanceReportRow" }
    FinanceSettings:
      type: object
      required: [schoolId, partialPaymentsEnabled, bankTransferEnabled, paystackEnabled, flutterwaveEnabled, bankName, accountName, accountNumber]
      properties:
        schoolId: { type: integer }
        partialPaymentsEnabled: { type: boolean }
        bankTransferEnabled: { type: boolean, description: "Explicit school-admin approval and enablement for parent bank transfers" }
        paystackEnabled: { type: boolean, description: "School-approved Paystack test-provider checkout enablement" }
        flutterwaveEnabled: { type: boolean, description: "School-approved Flutterwave test-provider checkout enablement" }
        bankName: { type: ["string", "null"] }
        accountName: { type: ["string", "null"] }
        accountNumber: { type: ["string", "null"], pattern: "^[0-9]{10}$" }
    FinanceSettingsUpdate:
      type: object
      properties:
        partialPaymentsEnabled: { type: boolean }
        bankTransferEnabled: { type: boolean }
        paystackEnabled: { type: boolean }
        flutterwaveEnabled: { type: boolean }
        bankName: { type: ["string", "null"], minLength: 2, maxLength: 100 }
        accountName: { type: ["string", "null"], minLength: 2, maxLength: 150 }
        accountNumber: { type: ["string", "null"], pattern: "^[0-9]{10}$" }
    ParentInvoiceBankDetails:
      oneOf:
        - $ref: "#/components/schemas/ParentInvoiceBankDetailsAvailable"
        - $ref: "#/components/schemas/ParentInvoiceBankDetailsUnavailable"
    ParentInvoiceBankDetailsAvailable:
      type: object
      required: [invoiceId, schoolId, available, bankName, accountName, accountNumber]
      properties:
        invoiceId: { type: integer }
        schoolId: { type: integer }
        available: { type: boolean, const: true }
        bankName: { type: string }
        accountName: { type: string }
        accountNumber: { type: string, pattern: "^[0-9]{10}$" }
    ParentInvoiceBankDetailsUnavailable:
      type: object
      required: [invoiceId, schoolId, available, reason]
      properties:
        invoiceId: { type: integer }
        schoolId: { type: integer }
        available: { type: boolean, const: false }
        reason: { type: string, enum: [BANK_DETAILS_UNAVAILABLE] }
    FeeProviderCheckout:
      type: object
      required: [paymentId, invoiceId, reference, provider, amountMinor, currency, status, checkoutUrl]
      properties:
        paymentId: { type: integer }
        invoiceId: { type: integer }
        reference: { type: string }
        provider: { type: string, enum: [PAYSTACK, FLUTTERWAVE] }
        amountMinor: { type: integer }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        status: { type: string, enum: [PENDING] }
        checkoutUrl: { type: string, format: uri }
    FeeProviderCheckoutProcessing:
      type: object
      required: [outcome, error]
      properties:
        outcome: { type: string, enum: [processing, reconciliation_required] }
        error: { type: string }
    FeeProviderCheckoutInitializeInput:
      type: object
      additionalProperties: false
      properties:
        amountMinor: { type: integer, minimum: 1, maximum: 9007199254740991 }
    ParentFeeInvoiceCheckoutPolicy:
      type: object
      required: [invoiceId, schoolId, outstandingMinor, partialPaymentsEnabled]
      properties:
        invoiceId: { type: integer }
        schoolId: { type: integer }
        outstandingMinor: { type: integer, minimum: 0 }
        partialPaymentsEnabled: { type: boolean }
    FeeProviderReconciliationEvent:
      type: object
      required: [id, provider, eventId, paymentId, schoolId, providerReference, webhookTransactionId, verifiedTransactionId, status, errorMessage, signatureVerified, receivedAt, updatedAt]
      properties:
        id: { type: integer }
        provider: { type: string, enum: [PAYSTACK, FLUTTERWAVE] }
        eventId: { type: string }
        paymentId: { type: ["integer", "null"] }
        schoolId: { type: ["integer", "null"] }
        providerReference: { type: ["string", "null"] }
        webhookTransactionId: { type: ["string", "null"] }
        verifiedTransactionId: { type: ["string", "null"] }
        status: { type: string, enum: [RECONCILIATION_REQUIRED] }
        errorMessage: { type: ["string", "null"] }
        signatureVerified: { type: boolean }
        receivedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeeProviderReconciliationRetry:
      type: object
      required: [eventId, outcome]
      properties:
        eventId: { type: string }
        outcome: { type: string, enum: [verified, pending, failed, duplicate, reconciliation_required] }
    FeeProviderCheckoutReconciliation:
      type: object
      required: [paymentId, outcome]
      properties:
        paymentId: { type: integer }
        outcome: { type: string, enum: [verified, pending, released, duplicate, reconciliation_required] }