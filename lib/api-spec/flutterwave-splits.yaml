openapi: 3.1.0
info: { title: FlutterwaveSplits, version: 1.0.0 }
paths:
  /flutterwave/local-split-simulation:
    get:
      operationId: getLocalFlutterwaveSplitSimulation
      tags: [flutterwave-splits]
      responses:
        "200":
          description: "Owner-only Development TEST / NOT REAL in-memory preview; no database/provider access"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalFlutterwaveSplitSimulation" }
    post:
      operationId: runLocalFlutterwaveSplitSimulation
      tags: [flutterwave-splits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalFlutterwaveSplitSimulationInput" }
      responses:
        "200":
          description: "Stateless TEST / NOT REAL action; never operational configuration"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalFlutterwaveSplitSimulation" }
  /flutterwave/split-payments/{paymentId}/transaction-evidence:
    get:
      operationId: getFlutterwaveTransactionSplitEvidence
      tags: [flutterwave-splits]
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Explicit TEST provider read-back; no financial writes or bank settlement claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlutterwaveTransactionSplitEvidence" }
  /flutterwave/split-dashboard:
    get:
      operationId: getFlutterwaveSplitDashboard
      tags: [flutterwave-splits]
      parameters:
        - { name: schoolId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Scoped Development-only recipient and settlement information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlutterwaveSplitDashboard" }
  /flutterwave/split-recipients:
    post:
      operationId: submitFlutterwaveSplitRecipient
      tags: [flutterwave-splits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlutterwaveRecipientInput" }
      responses:
        "201":
          description: Bank resolved, awaiting ownership review; not yet split ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlutterwaveRecipient" }
  /flutterwave/split-recipients/{recipientId}/review:
    post:
      operationId: reviewFlutterwaveSplitRecipient
      tags: [flutterwave-splits]
      parameters:
        - { name: recipientId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlutterwaveRecipientReview" }
      responses:
        "200":
          description: Owner review or safe read-back recovery, never implicit bank settlement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlutterwaveRecipient" }
  /flutterwave/split-schools/{schoolId}/configuration:
    patch:
      operationId: configureFlutterwaveSchoolSplits
      tags: [flutterwave-splits]
      parameters:
        - { name: schoolId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlutterwaveSchoolSplitInput" }
      responses:
        "200":
          description: Future checkout configuration; existing payments are never backfilled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlutterwaveSchoolSplitConfiguration" }
  /flutterwave/split-payments/{paymentId}/reconcile:
    post:
      operationId: reconcileFlutterwaveSplitPayment
      tags: [flutterwave-splits]
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Provider report inspection without initiating transfers or new credits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlutterwaveSplitPayment" }
  /flutterwave/split-payments/{paymentId}/refunds:
    post:
      operationId: requestFlutterwaveSplitRefund
      tags: [flutterwave-splits]
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlutterwaveSplitRefundInput" }
      responses:
        "200":
          description: Refund request recorded; initiation is not completed customer disbursement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlutterwaveSplitAdjustment" }
  /flutterwave/split-adjustments/{adjustmentId}/verify:
    post:
      operationId: verifyFlutterwaveSplitRefund
      tags: [flutterwave-splits]
      parameters:
        - { name: adjustmentId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Independently verify refund; repeated verification has no repeated accounting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlutterwaveSplitAdjustment" }
components:
  schemas:
    LocalFlutterwaveSplitSimulationInput:
      type: object
      additionalProperties: false
      required: [mode, exampleSchoolId, action, acknowledgeFictional]
      properties:
        mode: { type: string, enum: [LOCAL_SPLIT_SIMULATION] }
        exampleSchoolId: { type: integer, enum: [1496] }
        action: { type: string, enum: [PREVIEW, REVIEW, ENABLE, DISABLE, RESET] }
        acknowledgeFictional: { type: boolean }
    LocalFlutterwaveSplitSimulation:
      type: object
      required: [mode, label, exampleSchoolId, exampleSchoolName, simulationRecipientId, fictionalBusiness, fictionalContact, fictionalPhone, fictionalBank, fictionalBankCode, fictionalAccount, recipientState, reviewedForSimulation, simulatedEnabled, operationalEnabled, testReady, ownershipVerified, providerVerified, checkoutAllowed, webhooksAllowed, allocationProven, bankSettlementVerified, providerFeesIncluded, noPartner, simulationTotalMinor, simulationSchoolMinor, simulationPlatformGrossMinor, notice]
      properties:
        mode: { type: string, enum: [LOCAL_SPLIT_SIMULATION] }
        label: { type: string, enum: ["TEST / NOT REAL"] }
        exampleSchoolId: { type: integer, enum: [1496] }
        exampleSchoolName: { type: string }
        simulationRecipientId: { type: string }
        fictionalBusiness: { type: string }
        fictionalContact: { type: string }
        fictionalPhone: { type: string }
        fictionalBank: { type: string }
        fictionalBankCode: { type: string }
        fictionalAccount: { type: string }
        recipientState: { type: string, enum: [LOCAL_ONLY_UNVERIFIED] }
        reviewedForSimulation: { type: boolean }
        simulatedEnabled: { type: boolean }
        operationalEnabled: { type: boolean, enum: [false] }
        testReady: { type: boolean, enum: [false] }
        ownershipVerified: { type: boolean, enum: [false] }
        providerVerified: { type: boolean, enum: [false] }
        checkoutAllowed: { type: boolean, enum: [false] }
        webhooksAllowed: { type: boolean, enum: [false] }
        allocationProven: { type: boolean, enum: [false] }
        bankSettlementVerified: { type: boolean, enum: [false] }
        providerFeesIncluded: { type: boolean, enum: [false] }
        noPartner: { type: boolean, enum: [true] }
        simulationTotalMinor: { type: integer, enum: [500000] }
        simulationSchoolMinor: { type: integer, enum: [200000] }
        simulationPlatformGrossMinor: { type: integer, enum: [300000] }
        notice: { type: string }
    FlutterwaveTransactionSplitEvidence:
      type: object
      required: [status, evidenceLevel, reason, bankSettlementVerified, paymentId, transactionId, reference, checkedAt, source, platformGrossMinor, platformNetMinor, appFeeMinor, additionalFeeMinor, recipients]
      properties:
        status: { type: string, enum: [UNCONFIRMED, MISMATCH, CONFIRMED] }
        evidenceLevel:
          type: string
          enum: [UNAVAILABLE, PARTIAL, MISMATCH, COMPLETE_VERIFIED]
          description: "Application classification, not a Flutterwave field. The current v3 verify adapter cannot emit COMPLETE_VERIFIED or CONFIRMED."
        reason: { type: string }
        bankSettlementVerified: { type: boolean, enum: [false] }
        paymentId: { type: integer }
        transactionId: { type: string }
        reference: { type: string }
        checkedAt: { type: string }
        source: { type: string }
        platformGrossMinor: { type: integer }
        platformNetMinor: { type: [integer, "null"] }
        appFeeMinor: { type: [integer, "null"] }
        additionalFeeMinor: { type: [integer, "null"] }
        recipients:
          type: array
          items: { $ref: "#/components/schemas/FlutterwaveTransactionSplitRecipientEvidence" }
    FlutterwaveTransactionSplitRecipientEvidence:
      type: object
      required: [subaccountId, amountMinor, observedAmountMinor]
      properties:
        subaccountId: { type: string }
        amountMinor: { type: integer }
        observedAmountMinor: { type: [integer, "null"] }
    FlutterwaveRecipientInput:
      type: object
      additionalProperties: false
      required: [kind, entityId, bankCode, accountNumber, contactPhone, businessEmail, ownershipAttestation]
      properties:
        kind: { type: string, enum: [SCHOOL, PARTNER] }
        entityId: { type: integer, minimum: 1 }
        bankCode: { type: string, pattern: "^[0-9]{3,6}$" }
        accountNumber: { type: string, pattern: "^[0-9]{10}$" }
        contactPhone: { type: string, minLength: 10, maxLength: 16 }
        businessEmail: { type: string, format: email, maxLength: 254 }
        ownershipAttestation: { type: boolean }
    FlutterwaveRecipientReview:
      type: object
      additionalProperties: false
      required: [action, note]
      properties:
        action: { type: string, enum: [APPROVE_AND_CREATE_TEST, VERIFY_EXISTING_TEST, RECOVER, SUSPEND, RETIRE] }
        note: { type: string, minLength: 10, maxLength: 1000 }
        ownershipConfirmed: { type: boolean }
        distinctFromPlatformAccountConfirmed: { type: boolean }
        existingTestReference: { type: string, enum: [RS_5F0DB5C736A2550E783A15B9EB9FBF09] }
    FlutterwaveSchoolSplitInput:
      type: object
      additionalProperties: false
      required: [enabled, testSplitVerificationAuthorized]
      properties:
        enabled: { type: boolean }
        testSplitVerificationAuthorized: { type: boolean }
    FlutterwaveSchoolSplitConfiguration:
      type: object
      required: [schoolId, enabled, testSplitVerificationAuthorized]
      properties:
        schoolId: { type: integer }
        enabled: { type: boolean }
        testSplitVerificationAuthorized: { type: boolean }
    FlutterwaveRecipient:
      type: object
      required: [id, kind, entityId, entityName, status, maskedAccount, accountName, bankName, mode]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [SCHOOL, PARTNER] }
        entityId: { type: integer }
        entityName: { type: string }
        status: { type: string }
        maskedAccount: { type: string }
        accountName: { type: string }
        bankName: { type: string }
        maskedBusinessEmail: { type: ["string", "null"] }
        mode: { type: string, enum: [TEST] }
        providerSubaccountId: { type: ["string", "null"] }
        reviewNote: { type: ["string", "null"] }
        lastError: { type: ["string", "null"] }
    FlutterwaveSplitPayment:
      type: object
      required: [paymentId, schoolId, studentId, termId, reference, status, collectionStatus, grossAmountMinor, schoolAmountMinor, partnerAmountMinor, platformAmountMinor, providerFeesMinor, providerTaxMinor, merchantGrossMinor, merchantNetMinor, merchantNetStatus, providerSettlementAmountMinor, confirmedRefundMinor, internalPartnerAccrualMinor, internalPartnerAccrualStatus, webhookEvents, currency, reconciliationNote, recipients, adjustments]
      properties:
        paymentId: { type: integer }
        schoolId: { type: integer }
        studentId: { type: integer }
        termId: { type: integer }
        reference: { type: string }
        status: { type: string }
        collectionStatus: { type: string }
        grossAmountMinor: { type: integer }
        schoolAmountMinor: { type: integer }
        partnerAmountMinor: { type: integer }
        platformAmountMinor: { type: integer }
        providerFeeMinor: { type: ["integer", "null"] }
        providerAdditionalFeeMinor: { type: ["integer", "null"] }
        providerFeesMinor: { type: ["integer", "null"] }
        providerTaxMinor: { type: ["integer", "null"], description: "Taxes are not separately identified by the current verified transaction fields; null is not zero." }
        merchantGrossMinor: { type: integer }
        merchantNetMinor: { type: ["integer", "null"], description: "Calculated merchant gross less reported provider costs; not a bank-credit claim and excludes refunds." }
        merchantNetStatus: { type: string, enum: [PROVIDER_COSTS_INCOMPLETE, CALCULATED_BEFORE_REFUNDS_NOT_BANK_SETTLEMENT] }
        providerSettlementAmountMinor: { type: ["integer", "null"], description: "Provider-reported transaction amount only; not bank-settlement evidence." }
        confirmedRefundMinor: { type: integer }
        internalPartnerAccrualMinor: { type: integer }
        internalPartnerAccrualStatus: { type: string }
        platformNetMinor: { type: ["integer", "null"] }
        webhookEvents:
          type: array
          items: { $ref: "#/components/schemas/FlutterwaveStudentSubscriptionWebhookEvent" }
        currency: { type: string }
        reconciliationNote: { type: ["string", "null"] }
        recipients:
          type: array
          items: { $ref: "#/components/schemas/FlutterwaveRecipientSettlement" }
        adjustments:
          type: array
          items: { $ref: "#/components/schemas/FlutterwaveSplitAdjustment" }
    FlutterwaveRecipientSettlement:
      type: object
      required: [recipientId, expectedAmountMinor, status]
      properties:
        recipientId: { type: integer }
        expectedAmountMinor: { type: integer }
        observedAmountMinor: { type: ["integer", "null"] }
        providerSettlementId: { type: ["string", "null"] }
        status: { type: string }
        exception: { type: ["string", "null"] }
    FlutterwaveSplitRefundInput:
      type: object
      additionalProperties: false
      required: [amountMinor, reason, idempotencyKey]
      properties:
        amountMinor: { type: integer, minimum: 10000, maximum: 500000 }
        reason: { type: string, minLength: 10, maxLength: 300 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 80 }
    FlutterwaveSplitAdjustment:
      type: object
      required: [id, paymentId, amountMinor, status, recoveryStatus]
      properties:
        id: { type: integer }
        paymentId: { type: integer }
        amountMinor: { type: integer }
        status: { type: string }
        providerRefundId: { type: ["string", "null"] }
        recoveryStatus: { type: string }
        schoolRecoveryMinor: { type: ["integer", "null"] }
        partnerRecoveryMinor: { type: ["integer", "null"] }
        platformReversalMinor: { type: ["integer", "null"] }
    FlutterwaveSplitScope:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [SCHOOL, PARTNER] }
        id: { type: integer }
        name: { type: string }
    FlutterwaveCurrentAllocationPolicy:
      description: Current student subscription policy, not a recalculation of historical payments. V3 has a school-only checkout allocation and internal deferred Partner payable. Owner economic shares are before provider expenses, not verified merchant bank credits.
      type: object
      required: [version, schoolMinor, platformWithPartnerMinor, platformWithoutPartnerMinor, partnerMinor]
      properties:
        version: { type: integer, enum: [2, 3] }
        schoolMinor: { type: integer }
        platformWithPartnerMinor: { type: integer }
        platformWithoutPartnerMinor: { type: integer }
        partnerMinor: { type: integer }
        deferredPartner: { type: boolean, description: V3 accrues eligible Partner commission internally rather than adding a Partner checkout subaccount. }
    FlutterwaveSplitDashboard:
      type: object
      required: [developmentOnly, mode, currency, feeBearer, feeBearerSettingVerified, isOwner, currentAllocationPolicy, testCredentialConfigured, scopes, recipients, schools, payments]
      properties:
        developmentOnly: { type: boolean }
        mode: { type: string, enum: [TEST] }
        currency: { type: string, enum: [NGN] }
        feeBearer: { type: string, enum: [MERCHANT] }
        feeBearerSettingVerified: { type: boolean, enum: [false], description: "Support-confirmed model only; the actual merchant dashboard setting has not been inspected." }
        isOwner: { type: boolean }
        currentAllocationPolicy:
          description: Owner-only current policy. Null for other roles; complete historical payment breakdowns are also Owner-only.
          anyOf:
            - { $ref: "#/components/schemas/FlutterwaveCurrentAllocationPolicy" }
            - { type: "null" }
        testCredentialConfigured: { type: boolean }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/FlutterwaveSplitScope" }
        recipients:
          type: array
          items: { $ref: "#/components/schemas/FlutterwaveRecipient" }
        schools:
          type: array
          items: { $ref: "#/components/schemas/FlutterwaveSchoolSplitConfiguration" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/FlutterwaveSplitPayment" }
    FlutterwaveStudentSubscriptionWebhookEvent:
      type: object
      required: [eventId, transactionId, status, signatureVerified, payloadSha256, receivedAt, updatedAt, error]
      properties:
        eventId: { type: string }
        transactionId: { type: ["string", "null"] }
        status: { type: string, enum: [RECEIVED, VERIFIED, PENDING, FAILED, RECONCILIATION_REQUIRED] }
        signatureVerified: { type: boolean }
        payloadSha256: { type: string }
        receivedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        error: { type: ["string", "null"] }
