openapi: 3.1.0
info:
  title: EduCore existing-person activation and result review additions
  version: 1.0.0
paths:
  /school-users/invitations:
    post:
      operationId: createExistingProfileInvitation
      tags: [Users]
      summary: Invite a selected existing school profile using authoritative profile details
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExistingProfileInvitationRequest" }
      responses:
        "202":
          description: Clerk accepted a single-use invitation dispatch request; delivery is not verified.
  /students:
    post:
      operationId: createStudentProfileWithOptionalIdentifiers
      tags: [Students]
      summary: Create a student with an optional profile email and optional admission number
      parameters:
        - in: query
          name: schoolId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStudentProfileRequest" }
      responses:
        "201":
          description: Created student profile. Missing admission numbers are generated by the server.
  /students/{studentId}/contact:
    patch:
      operationId: updateStudentActivationContact
      tags: [Students]
      summary: Correct a selected student's activation email on the school profile
      parameters:
        - in: path
          name: studentId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: schoolId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, nullable: true }
      responses:
        "200":
          description: Updated same-school student contact email.
  /school-users/activation-candidates:
    get:
      operationId: listExistingActivationCandidates
      tags: [Users]
      summary: List existing school people eligible for an activation workflow
      parameters:
        - in: query
          name: schoolId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: role
          required: true
          schema: { type: string, enum: [SCHOOL_ADMIN, TEACHER, ACCOUNTANT, STAFF, PARENT, STUDENT] }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Existing people and linked-account status; no profile is created by this read.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExistingActivationCandidate" }
  /parents/{parentId}/children:
    get:
      operationId: listParentChildLinks
      tags: [Parents]
      summary: List students linked to one parent in the selected school
      parameters:
        - in: path
          name: parentId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: schoolId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: School-scoped linked student profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ParentChildLink" }
    post:
      operationId: linkExistingParentChildren
      tags: [Parents]
      summary: Add school-authorized children to an active parent account or an unlinked pending parent profile
      parameters:
        - in: path
          name: parentId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: schoolId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParentChildrenLinkRequest" }
      responses:
        "200":
          description: Active links, safely upserted and audited. An unlinked pending profile may receive links before its existing invitation is reused.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ParentChildLink" }
  /academic/results/review:
    get:
      operationId: listAcademicResultReviews
      tags: [Academic Results]
      summary: List private School Admin result review metadata
      parameters:
        - in: query
          name: schoolId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: assessmentId
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Review queue available only to authorized School Admins.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AcademicResultReviewItem" }
  /academic/results/{resultId}/submit:
    post:
      operationId: submitAcademicResultForReview
      tags: [Academic Results]
      summary: Submit an owned draft result for School Admin review
      parameters:
        - in: path
          name: resultId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicResultSchoolRequest" }
      responses:
        "200":
          description: Submitted result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicResultReviewItem" }
  /academic/results/{resultId}/review:
    post:
      operationId: reviewAcademicResult
      tags: [Academic Results]
      summary: Approve or return a submitted result with a private review comment
      parameters:
        - in: path
          name: resultId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicResultReviewRequest" }
      responses:
        "200":
          description: Review outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicResultReviewItem" }
components:
  schemas:
    ExistingProfileInvitationRequest:
      type: object
      required: [schoolId, role, personId]
      properties:
        schoolId: { type: integer, minimum: 1 }
        fullName: { type: string, description: Optional client display value; the selected profile name is authoritative. }
        email: { type: string, format: email, description: Optional client display value; the selected profile email is authoritative. }
        phone: { type: string, nullable: true, description: Optional client display value; the selected profile phone is authoritative. }
        role: { type: string, enum: [TEACHER, ACCOUNTANT, STAFF, PARENT, STUDENT] }
        personId: { type: integer, minimum: 1 }
        studentId: { type: integer, minimum: 1, nullable: true }
    CreateStudentProfileRequest:
      type: object
      required: [firstName, lastName, gender, className, section]
      properties:
        admissionNo:
          type: string
          nullable: true
          description: Optional. Blank or omitted values are generated within the school's transaction.
        email: { type: string, format: email, nullable: true }
        firstName: { type: string }
        middleName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        gender: { type: string, enum: [male, female, other] }
        className: { type: string }
        section: { type: string }
    ExistingActivationCandidate:
      type: object
      required: [personId, personType, fullName, profileStatus]
      properties:
        personId: { type: integer }
        personType: { type: string }
        fullName: { type: string }
        email: { type: string, nullable: true }
        profileEmail: { type: string, nullable: true }
        accountEmail: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        profileStatus: { type: string, nullable: true }
        accountStatus: { type: string, nullable: true }
        accountId: { type: integer, nullable: true }
        linkedUserId: { type: integer, nullable: true }
        admissionNo: { type: string, nullable: true }
        employeeNo: { type: string, nullable: true }
    ParentChildLink:
      type: object
      required: [id, schoolId, admissionNo, firstName, lastName, relationshipType, relationshipStatus]
      properties:
        id: { type: integer }
        schoolId: { type: integer }
        admissionNo: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        className: { type: string, nullable: true }
        section: { type: string, nullable: true }
        studentStatus: { type: string }
        relationshipType: { type: string }
        relationshipStatus: { type: string }
    ParentChildrenLinkRequest:
      type: object
      required: [studentIds]
      properties:
        studentIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        relationshipType:
          type: string
          enum: [Father, Mother, Guardian, Grandparent, Other]
    AcademicResultSchoolRequest:
      type: object
      required: [schoolId]
      properties:
        schoolId: { type: integer, minimum: 1 }
    AcademicResultReviewRequest:
      allOf:
        - { $ref: "#/components/schemas/AcademicResultSchoolRequest" }
        - type: object
          required: [decision]
          properties:
            decision: { type: string, enum: [APPROVE, RETURN] }
            comment: { type: string, maxLength: 2000, nullable: true }
    AcademicResultReviewItem:
      type: object
      required: [id, schoolId, status, reviewStatus]
      properties:
        id: { type: integer }
        schoolId: { type: integer }
        assessmentId: { type: integer }
        studentId: { type: integer }
        score: { type: number }
        maxScore: { type: number }
        status: { type: string, enum: [DRAFT, SUBMITTED, PUBLISHED, ARCHIVED] }
        reviewStatus: { type: string, enum: [NOT_REVIEWED, APPROVED, RETURNED] }
        reviewComment: { type: string, nullable: true }
        reviewedBy: { type: integer, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        studentName: { type: string, nullable: true }
        admissionNo: { type: string, nullable: true }