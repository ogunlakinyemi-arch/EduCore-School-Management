paths:
  /communication/telegram/status:
    get:
      operationId: getTelegramStatus
      tags: [communication]
      parameters:
        - {name: schoolId, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Sanitized delivery configuration and own-parent linking state; no credentials/chat IDs
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TelegramStatus"}
  /communication/telegram/health:
    post:
      operationId: checkTelegramHealth
      tags: [communication]
      responses:
        "200":
          description: Owner-only stateless Bot API getMe/getWebhookInfo diagnostics; never refreshes delivery readiness or sends a message
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TelegramStatus"}
  /communication/telegram/link:
    post:
      operationId: createTelegramLink
      tags: [communication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schoolId, consent]
              properties:
                schoolId: {type: integer, minimum: 1}
                consent: {type: boolean, const: true}
      responses:
        "200":
          description: Single-use ten-minute private-chat start link; confirmation in EduCore is required
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: {type: string}
                  expiresAt: {type: string}
    delete:
      operationId: unlinkTelegram
      tags: [communication]
      responses:
        "200":
          description: Withdraw own consent, revoke pending tokens and cancel queued Telegram deliveries
          content:
            application/json:
              schema: {type: object, required: [unlinked], properties: {unlinked: {type: boolean}}}
  /communication/telegram/link/confirm:
    post:
      operationId: confirmTelegramLink
      tags: [communication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schoolId, consent]
              properties:
                schoolId: {type: integer, minimum: 1}
                consent: {type: boolean, enum: [true]}
      responses:
        "200":
          description: Authenticated parent confirms the private chat that consumed their token
          content:
            application/json:
              schema: {type: object, required: [linked], properties: {linked: {type: boolean}}}
  /communication/telegram/parents/{parentId}:
    get:
      operationId: getParentTelegramInvitation
      tags: [communication]
      parameters:
        - {name: parentId, in: path, required: true, schema: {type: integer, minimum: 1}}
        - {name: schoolId, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: School Admin status only; no chat identifiers or reusable links
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParentTelegramInvitation"}
  /communication/telegram/parents/{parentId}/invitation:
    post:
      operationId: createParentTelegramInvitation
      tags: [communication]
      parameters:
        - {name: parentId, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TelegramInvitationInput"}
      responses:
        "200":
          description: New single-use invitation, returned only once; refresh revokes previous pending invitation
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/ParentTelegramInvitation"}
                  - type: object
                    required: [url]
                    properties:
                      url: {type: string}
components:
  schemas:
    TelegramStatus:
      type: object
      required: [configured, ready, reason, botUsername, linked, consented, parentEligible, policyAllowed, pending, pendingAccountLabel]
      properties:
        configured: {type: boolean}
        ready: {type: boolean}
        reason: {type: string}
        botUsername: {type: [string, "null"]}
        diagnosticOk: {type: boolean}
        diagnosticReason: {type: string}
        storageReady: {type: boolean}
        storageMissing:
          type: array
          items: {type: string}
        linked: {type: boolean}
        consented: {type: boolean}
        parentEligible: {type: boolean}
        policyAllowed: {type: boolean}
        pending: {type: boolean}
        pendingAccountLabel: {type: [string, "null"]}
        schoolName: {type: [string, "null"]}
        children:
          type: array
          items: {type: string}
        phoneCheck: {type: [string, "null"], enum: [MATCH, MISMATCH, null]}
        invitationOnly: {type: boolean}
    TelegramInvitationInput:
      type: object
      additionalProperties: false
      required: [schoolId]
      properties:
        schoolId: {type: integer, minimum: 1}
    ParentTelegramInvitation:
      type: object
      required: [status, canInvite, expiresAt, pushAvailable]
      properties:
        status:
          type: string
          enum: [Not invited, Invitation pending, Linked, Disabled/consent withdrawn, Delivery unavailable]
        canInvite: {type: boolean}
        expiresAt: {type: [string, "null"]}
        pushAvailable: {type: boolean}
