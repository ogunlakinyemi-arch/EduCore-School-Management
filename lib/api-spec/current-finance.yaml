openapi: 3.1.0
info: { title: Current finance and field SMS, version: 1.0.0 }
paths:
  /current-finance/school-assistance:
    get:
      operationId: getOwnerSchoolAssistanceRequests
      tags: [current-finance]
      description: Owner-only read of school remittance requests; never verifies payment or enables financial operations.
      parameters:
        - { in: query, name: schoolId, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated requests; storageAvailable is false only when the request table is absent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolAssistanceRequestPage' }
        '403':
          description: Active Platform Owner authorization required.
  /current-finance/overview:
    get:
      operationId: getCurrentFinanceOverview
      tags: [current-finance]
      parameters:
        - { in: query, name: schoolId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: termId, schema: { type: integer, minimum: 1 } }
        - { in: query, name: view, schema: { type: string, enum: [SCHOOL, BRO, OWNER] } }
      responses:
        '200':
          description: Scoped current subledger; all money is integer minor units
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentFinanceDocument' }
  /current-finance/actions:
    post:
      operationId: actOnCurrentFinance
      tags: [current-finance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentFinanceActionInput'
      responses:
        '200':
          description: Persisted result; acceptance and approval never imply settlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentFinanceDocument' }
  /current-finance/receipts/{id}:
    get:
      operationId: getCurrentFinanceReceipt
      tags: [current-finance]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
        - { in: query, name: allocationId, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Authorized consolidated receipt or one child receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentFinanceDocument' }
  /bro-field/sms:
    get:
      operationId: getFieldSmsCampaigns
      tags: [bro-field]
      responses:
        '200':
          description: Owner-only eligible contacts and campaign history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentFinanceDocument' }
  /bro-field/sms/preview:
    post:
      operationId: previewFieldSmsCampaign
      tags: [bro-field]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, key, all]
              properties:
                message: { type: string, minLength: 1, maxLength: 1000 }
                key: { type: string, minLength: 16, maxLength: 100 }
                all: { type: boolean }
                leadIds: { type: array, items: { type: integer, minimum: 1 }, maxItems: 500 }
      responses:
        '200':
          description: Frozen preview; no message sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentFinanceDocument' }
  /bro-field/sms/permission:
    post:
      operationId: recordFieldSmsPermission
      tags: [bro-field]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leadId, allowed, reason]
              properties:
                leadId: { type: integer, minimum: 1 }
                allowed: { type: boolean }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Audited contact permission; no dispatch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentFinanceDocument' }
  /bro-field/sms/{id}/dispatch:
    post:
      operationId: dispatchFieldSmsCampaign
      tags: [bro-field]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digest, confirm]
              properties:
                digest: { type: string, pattern: '^[a-f0-9]{64}$' }
                confirm: { type: boolean }
      responses:
        '200':
          description: Durable per-recipient results; unknown acceptance cannot be resent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentFinanceDocument' }
components:
  schemas:
    SchoolAssistanceRequestPage:
      type: object
      required: [schools, batches, total, page, pageSize, storageAvailable]
      properties:
        schools:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        storageAvailable: { type: boolean }
        batches:
          type: array
          items: { $ref: '#/components/schemas/SchoolAssistanceBatch' }
    SchoolAssistanceBatch:
      type: object
      required: [id, schoolId, schoolName, termId, termName, reference, state, amountMinor, method, checkoutUrl, items]
      properties:
        id: { type: integer }
        schoolId: { type: integer }
        schoolName: { type: string }
        termId: { type: integer }
        termName: { type: string }
        reference: { type: string }
        state: { type: string }
        amountMinor: { type: integer }
        method: { type: string, enum: [COMPANY_BANK] }
        checkoutUrl: { type: "null" }
        bankProof:
          type: object
          required: [bankName, statementReference, creditDate, amountMinor, verifiedAt, verifiedBy]
          properties:
            bankName: { type: string }
            statementReference: { type: string }
            creditDate: { type: string }
            amountMinor: { type: integer }
            verifiedAt: { type: string }
            verifiedBy: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [id, studentId, studentName, state, error]
            properties:
              id: { type: integer }
              studentId: { type: integer }
              studentName: { type: string }
              state: { type: string }
              error: { type: [string, "null"] }
    CurrentFinanceActionInput:
      type: object
      required: [action, payload]
      properties:
        action:
          type: string
          enum: [REFUND_REQUEST, REFUND_APPROVE, REFUND_DISPATCH, REFUND_RECONCILE, COLLECTION_REVERSAL, WITHDRAW_REQUEST, WITHDRAW_DECIDE, PAYOUT_INITIATE, PAYOUT_RECONCILE, PAYOUT_BANK_REVEAL, PAYOUT_RECORD_EXTERNAL, BRO_RECOVERY, BULK_CREATE, BULK_VERIFY, BULK_RECOVER, BULK_RETRY, BANK_REQUEST, BANK_INSTRUCTIONS, BANK_VERIFY, BANK_POST, BANK_REJECT, BANK_CANCEL, LEGACY_ASSISTANCE_CANCEL]
        payload:
          type: object
          additionalProperties: true
      description: >-
        BANK_REQUEST uses schoolId, termId, distinct studentIds, key and reason.
        BANK_VERIFY uses id, bankName, statementReference, creditDate, exact amountMinor,
        independentlyChecked=true, key and reason. BANK_POST uses id, key and reason.
        BANK_REJECT/BANK_CANCEL use id, key and reason, only before verified credit.
        BULK_RETRY uses id, key and reason; fresh server verification of a retained
        failed zero-charge transaction is mandatory. No client no-charge assertion is accepted.
        PAYOUT_BANK_REVEAL uses id, key and reason for an audited Owner-only reveal
        of the existing frozen bank instructions. PAYOUT_RECORD_EXTERNAL uses distinct
        ids, key, reason, transferReference, statementReference, transferDate (YYYY-MM-DD),
        exact amountMinor, confirmExternalTransfer=true and independentlyChecked=true.
        It records the Owner's independently checked, already-completed external bank
        transfer against approved reserved lines in the existing ledger; it never sends
        money or claims automatic bank/provider verification.
    CurrentFinanceDocument:
      type: object
      description: Role-scoped domain document; payment assertions never replace the applicable server verification or explicit Owner bank-statement review.
      additionalProperties: true
