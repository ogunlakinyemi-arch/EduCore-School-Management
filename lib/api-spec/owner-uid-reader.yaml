ownerHardwareCorrection:
  get:
    operationId: getOwnerHardwareCorrection
    tags: [platform]
    summary: Owner-only read-only preflight for the exact Device 4 to Device 3 hardware identity correction
    responses:
      "200":
        description: Fresh non-secret review token and exact before/after mapping
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint, before, after]
              properties:
                fingerprint: { type: string }
                before: { type: array, items: { $ref: "#/components/schemas/OwnerHardwareIdentity" } }
                after: { type: array, items: { $ref: "#/components/schemas/OwnerHardwareIdentity" } }
      "403": { description: Active bound Owner required }
      "409": { description: Unreviewed or changed device/schema state }
  post:
    operationId: applyOwnerHardwareCorrection
    tags: [platform]
    summary: Atomically correct the exact two existing records, preserve Owner credential and append audit evidence
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OwnerHardwareCorrectionInput" }
    responses:
      "200":
        description: Committed audit evidence; no firmware or queued event changes
        content:
          application/json:
            schema:
              type: object
              required: [before, after, auditId, auditedAt, credentialPreserved]
              properties:
                before: { type: array, items: { $ref: "#/components/schemas/OwnerHardwareIdentity" } }
                after: { type: array, items: { $ref: "#/components/schemas/OwnerHardwareIdentity" } }
                auditId: { type: integer }
                auditedAt: { type: string }
                credentialPreserved: { type: boolean }
      "400": { description: Explicit reviewed confirmation and reason required }
      "403": { description: Active bound Owner required }
      "409": { description: Stale preflight or unsafe state; no committed correction }
ownerUidInventory:
  get:
    operationId: getOwnerUidInventory
    tags: [platform]
    summary: Read Owner UID-only reader bindings and captured UID inventory
    parameters:
      - { name: q, in: query, schema: { type: string, maxLength: 128 } }
      - { name: deviceId, in: query, schema: { type: integer, minimum: 1 } }
      - { name: status, in: query, schema: { type: string, enum: [UNKNOWN_UNASSIGNED, ASSIGNED, RESERVED, DUPLICATE] } }
      - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
    responses:
      "200":
        description: Platform Owner only; no credentials are returned
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerUidInventory"
ownerUidBinding:
  post:
    operationId: bindOwnerUidReader
    tags: [platform]
    summary: Assign an unassigned NFC reader to the authenticated Platform Owner for UID-only capture
    parameters:
      - { name: deviceId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OwnerReaderReason" }
    responses:
      "201":
        description: Device credential shown once; never a school attendance credential
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, purpose, credential]
              properties:
                deviceId: { type: integer }
                purpose: { type: string, enum: [OWNER_UID_READER] }
                credential: { type: string }
                credentialVersion: { type: string }
                configuration: { $ref: "#/components/schemas/OwnerReaderConfiguration" }
ownerUidCredential:
  post:
    operationId: rotateOwnerUidReaderCredential
    tags: [platform]
    summary: Explicitly rotate only this Owner-bound reader credential and return its matching protocol configuration once
    parameters:
      - { name: deviceId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason, confirm, expectedCredentialVersion]
            properties:
              reason: { type: string, minLength: 3, maxLength: 500 }
              confirm: { type: boolean, enum: [true] }
              expectedCredentialVersion: { type: string, pattern: '^[a-f0-9]{16}$' }
    responses:
      "200":
        description: Old key revoked immediately. Replacement shown once; load it into only this physical reader.
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, purpose, credential, credentialVersion, configuration]
              properties:
                deviceId: { type: integer }
                purpose: { type: string, enum: [OWNER_UID_READER] }
                credential: { type: string }
                credentialVersion: { type: string }
                configuration: { $ref: "#/components/schemas/OwnerReaderConfiguration" }
      "403": { description: Only the current binding Owner can provision the replacement. }
      "409": { description: Binding changed or hardware is not an active Owner-only reader. }
ownerUidUnlink:
  post:
    operationId: unlinkOwnerUidReader
    tags: [platform]
    summary: Explicitly release Owner context and revoke its reader credential
    parameters:
      - { name: deviceId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OwnerReaderReason" }
    responses:
      "200": { description: Released for a separate explicit school assignment }
ownerUidEvent:
  post:
    operationId: ingestOwnerUidRead
    tags: [platform]
    summary: Authenticated physical reader UID report; never dispatches attendance
    description: Separate Owner-reader Bearer device credential, not a Clerk session or school credential. Only active Owner-bound NFC devices may report; timestamps within five minutes. No school or attendance fields accepted.
    security:
      - OwnerUidReaderKey: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OwnerUidRead" }
    responses:
      "200":
        description: Captured inventory UID, authenticated heartbeat/error or identical retry; never an attendance receipt
        content:
          application/json:
            schema:
              type: object
              required: [success, uid, duplicate, purpose]
              properties:
                success: { type: boolean }
                uid: { type: [string, "null"] }
                rawUid: { type: [string, "null"], description: Original reader hex representation; canonical inventory UID uses uppercase without changing byte order. }
                scanStatus: { type: string, enum: [CAPTURED, READY, UNKNOWN_UNASSIGNED, ASSIGNED, RESERVED, UNSUPPORTED_CARD, READER_ERROR, TRANSPORT_ERROR] }
                duplicateUid: { type: boolean, description: UID already captured or registered; does not suppress the raw result. }
                duplicate: { type: boolean }
                purpose: { type: string, enum: [UID_INVENTORY_ONLY] }
      "400": { description: Malformed scan; authenticated attributable errors update reader status but never inventory. }
      "401": { description: "Missing, revoked or wrong reader credential, or device not actively Owner-linked." }
      "403": { description: Owner authority revoked. }
      "409": { description: Event ID reused for a different report. }
      "503": { description: Transport/service failure; no confirmed capture. Retry unchanged event ID and timestamp within the five-minute window. }
capturedUidAssignment:
  post:
    operationId: assignCapturedUidToStudent
    tags: [platform]
    summary: Owner confirms first student assignment of an authenticated captured available UID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [uid, schoolId, studentId, confirm]
            properties:
              uid: { type: string }
              schoolId: { type: integer, minimum: 1 }
              studentId: { type: integer, minimum: 1 }
              confirm: { type: boolean, enum: [true] }
    responses:
      "201":
        description: Assigned locked; activation and payment are unchanged
        content:
          application/json:
            schema:
              type: object
              required: [cardId, uid, schoolId, studentId, status]
              properties:
                cardId: { type: integer }
                uid: { type: string }
                schoolId: { type: integer }
                studentId: { type: integer }
                status: { type: string, enum: [locked] }
      "409": { description: "Uncaptured/reserved UID, prior student card or missing school reader" }
capturedCardUnlink:
  post:
    operationId: unlinkCardForCapturedReplacement
    tags: [platform]
    summary: Owner explicitly revokes lost/damaged UID before replacement selection; never bypasses payment
    parameters:
      - { name: cardId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kind, reason, confirm]
            properties:
              kind: { type: string, enum: [LOST, DAMAGED] }
              reason: { type: string, minLength: 3, maxLength: 480 }
              confirm: { type: boolean, enum: [true] }
    responses:
      "200": { description: "Existing replacement request/invoice, or employee revocation with requiresSchoolAdminRequest true" }
      "409": { description: Card cannot be replaced; revocation may already have committed before invoice failure }
capturedReplacementIssue:
  post:
    operationId: issueCapturedUidReplacement
    tags: [platform]
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [uid, confirm]
            properties:
              uid: { type: string }
              confirm: { type: boolean, enum: [true] }
    responses:
      "200": { description: "Existing replacement DTO; verified NGN 2000 payment, old UID revocation and captured availability enforced" }
      "409": { description: "Payment, old-card revocation, school reader or UID availability check failed" }
officialCardBrand:
  parameters:
    - { name: schoolId, in: path, required: true, schema: { type: integer, minimum: 1 } }
  get:
    operationId: getOfficialCardBrand
    tags: [platform]
    responses:
      "200":
        description: Owner-only configured school colors; null uses logo-derived fallback
        content:
          application/json:
            schema:
              type: object
              properties:
                primaryColor: { type: [string, "null"] }
                secondaryColor: { type: [string, "null"] }
  put:
    operationId: setOfficialCardBrand
    tags: [platform]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [primaryColor, secondaryColor]
            properties:
              primaryColor: { type: string, pattern: '^#[a-fA-F0-9]{6}$' }
              secondaryColor: { type: string, pattern: '^#[a-fA-F0-9]{6}$' }
    responses:
      "200": { description: Owner-saved audited school color palette }
officialCardVerification:
  post:
    operationId: verifyOfficialCardQr
    tags: [cards]
    summary: Public read-only opaque QR verification, no personal data or access grant
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string, maxLength: 256 }
    responses:
      "200":
        description: Current identity validation only; no UID, person or school information
        content:
          application/json:
            schema:
              type: object
              required: [valid, message]
              properties:
                valid: { type: boolean }
                message: { type: string }
      "503": { description: "Verification unavailable, never an access grant" }
components:
  securitySchemes:
    OwnerUidReaderKey:
      type: http
      scheme: bearer
      description: Dedicated Owner UID-reader device credential, revoked on unlink.
  schemas:
    OwnerHardwareIdentity:
      type: object
      required: [deviceId, serialNumber, status]
      properties:
        deviceId: { type: integer }
        serialNumber: { type: string, description: Empty only on the retained inactive historical Device 4 after this exact correction. }
        status: { type: string }
    OwnerHardwareCorrectionInput:
      type: object
      additionalProperties: false
      required: [fingerprint, reason, confirm]
      properties:
        fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        reason: { type: string, minLength: 3, maxLength: 500, pattern: '\S.*\S.*\S' }
        confirm: { type: boolean, enum: [true] }
    OwnerReaderConfiguration:
      type: object
      required: [endpointPath, method, authenticationHeader, authenticationScheme, deviceId, heartbeatIntervalSeconds]
      properties:
        endpointPath: { type: string, enum: [/api/v1/owner-reader/uid-events] }
        method: { type: string, enum: [POST] }
        authenticationHeader: { type: string, enum: [Authorization] }
        authenticationScheme: { type: string, enum: [Bearer] }
        deviceId: { type: string, description: Exact EDUCORE identifier for this linked physical device. }
        heartbeatIntervalSeconds: { type: integer, enum: [30] }
    OwnerReaderReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    OwnerUidRead:
      type: object
      additionalProperties: false
      required: [event_id, device_id, event_type, timestamp]
      properties:
        event_id: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$' }
        device_id:
          oneOf:
            - { type: string, pattern: '^EDUCORE(?:0[1-9]|[1-9][0-9]+)$' }
            - { type: integer, minimum: 1, maximum: 9007199254740991, deprecated: true }
            - { type: string, pattern: '^[1-9][0-9]*$', deprecated: true }
        uid: { type: string, pattern: '^(?:[a-fA-F0-9]{8}|[a-fA-F0-9]{14}|[a-fA-F0-9]{20})$', description: "Required for CARD_SCAN only. Send raw UID bytes in reader order, zero-padded hex; never check attendance eligibility before reporting." }
        event_type: { type: string, enum: [CARD_SCAN, READER_HEARTBEAT, CARD_SCAN_ERROR] }
        error_code: { type: string, enum: [UNSUPPORTED_CARD, READER_ERROR, TRANSPORT_ERROR], description: Required only for CARD_SCAN_ERROR. Never submit school attendance decisions. }
        timestamp: { type: string, description: Actual scan ISO timestamp within five minutes; retry unchanged. }
    OwnerUidInventory:
      type: object
      required: [readers, inventory]
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        readers:
          type: array
          items: { $ref: "#/components/schemas/OwnerUidReader" }
        inventory:
          type: array
          items: { $ref: "#/components/schemas/CapturedUid" }
    OwnerUidReader:
      type: object
      required: [deviceId, serialNumber, name, ownerUserId, lastReadAt]
      properties:
        deviceId: { type: integer }
        serialNumber: { type: string }
        name: { type: string }
        ownerUserId: { type: integer }
        lastReadAt: { type: [string, "null"] }
        credentialVersion: { type: string, description: Non-secret optimistic rotation token; never a device credential. }
        lastSeenAt: { type: [string, "null"] }
        lastFailureAt: { type: [string, "null"] }
        lastFailure:
          type: [object, "null"]
          properties:
            scanStatus: { type: string }
        lastReport:
          type: [object, "null"]
          properties:
            scanStatus: { type: string }
            uid: { type: [string, "null"] }
            rawUid: { type: [string, "null"] }
            duplicateUid: { type: boolean }
        lastScan:
          type: [object, "null"]
          properties:
            scanStatus: { type: string }
            uid: { type: string }
            rawUid: { type: string }
            duplicateUid: { type: boolean }
    CapturedUid:
      type: object
      required: [uid, readerDeviceId, capturedAt, assigned, schoolId, studentId, status]
      properties:
        uid: { type: string }
        rawUid: { type: string }
        firstSeenAt: { type: string }
        lastSeenAt: { type: string }
        scanCount: { type: integer }
        duplicate: { type: boolean }
        captureStatus: { type: string, enum: [UNKNOWN_UNASSIGNED, ASSIGNED, RESERVED] }
        deviceName: { type: [string, "null"] }
        serialNumber: { type: [string, "null"] }
        readerDeviceId: { type: integer }
        capturedAt: { type: string }
        assigned: { type: boolean }
        schoolId: { type: [integer, "null"] }
        studentId: { type: [integer, "null"] }
        status: { type: [string, "null"] }
