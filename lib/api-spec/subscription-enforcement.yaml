openapi: 3.1.0
info:
  title: Term subscription enforcement
  version: 1.0.0
paths:
  /subscription-enforcement:
    get:
      operationId: getSubscriptionEnforcementOverview
      tags: [SubscriptionEnforcement]
      parameters:
        - in: query
          name: schoolId
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Owner overview or authorized School Admin school summary
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SchoolSubscriptionSummary' }
  /subscription-enforcement/me:
    get:
      operationId: getMySubscriptionEnforcement
      tags: [SubscriptionEnforcement]
      responses:
        '200':
          description: Own student or related child access; no financial information
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubscriptionAccessStatus' }
  /subscription-enforcement/lock:
    post:
      operationId: lockSchoolSubscriptions
      tags: [SubscriptionEnforcement]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolEnforcementSelection'
      responses:
        '200':
          description: Independent confirmed Owner whole-school lock
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchoolEnforcementActionResult'
  /subscription-enforcement/unlock:
    post:
      operationId: unlockSchoolSubscriptions
      tags: [SubscriptionEnforcement]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolEnforcementSelection' }
      responses:
        '200':
          description: Remove only the manual school lock, never unpaid-student or security restrictions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SchoolEnforcementActionResult' }
  /subscription-enforcement/audit:
    get:
      operationId: getSchoolSubscriptionAudit
      tags: [SubscriptionEnforcement]
      parameters:
        - in: query
          name: schoolId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Recent immutable enforcement audits in the authorized school
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SchoolEnforcementAudit' }
components:
  schemas:
    SchoolEnforcementSelection:
      type: object
      additionalProperties: false
      required: [confirmed, schools]
      properties:
        confirmed: { type: boolean, const: true }
        reason: { type: string, maxLength: 500 }
        schools:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [schoolId, expectedVersion]
            properties:
              schoolId: { type: integer, minimum: 1 }
              expectedVersion: { type: integer, minimum: 0 }
    SchoolEnforcementActionResult:
      type: object
      required: [schoolId, changed, state]
      properties:
        schoolId: { type: integer }
        changed: { type: boolean }
        state: { type: string, enum: [ACTIVE, LOCKED, FAILED] }
        manualVersion: { type: integer }
        error: { type: string }
    SchoolEnforcementAudit:
      type: object
      required: [id, schoolId, action, timestamp, actorUserId, previousState, newState, reason, requestId, studentId]
      properties:
        id: { type: integer }
        schoolId: { type: integer }
        action: { type: string }
        timestamp: { type: string }
        actorUserId: { type: [integer, 'null'] }
        previousState: { type: [string, 'null'] }
        newState: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
        studentId: { type: [integer, 'null'] }
    SchoolSubscriptionSummary:
      type: object
      required: [schoolId, schoolName, status, state, schoolEnforcementStatus, manualVersion]
      properties:
        schoolId: { type: integer }
        schoolName: { type: string }
        status: { type: string }
        state: { type: string }
        schoolEnforcementStatus: { type: string, enum: [ACTIVE, LOCKED] }
        manualVersion: { type: integer }
        registrationNumber: { type: string }
        sessionId: { type: integer }
        sessionName: { type: string }
        lockedAt: { type: [string, 'null'] }
        lockedByUserId: { type: [integer, 'null'] }
        lockedByName: { type: [string, 'null'] }
        lastUnlockedAt: { type: [string, 'null'] }
        lastUnlockedByUserId: { type: [integer, 'null'] }
        lastUnlockedByName: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        termId: { type: integer }
        termName: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        enforcementDate: { type: string }
        inGracePeriod: { type: boolean }
        schoolLocked: { type: boolean }
        studentsTotal: { type: integer }
        studentsPaid: { type: integer }
        studentsAffected: { type: integer }
        teachersAffected: { type: integer }
        parentsAffected: { type: integer }
        cardsLocked: { type: integer }
        teacherCardsLocked: { type: integer }
        devicesLocked: { type: integer }
        amountDueMinor: { type: integer }
        amountPaidMinor: { type: integer }
        outstandingMinor: { type: integer }
    SubscriptionAccessStatus:
      type: object
      required: [schoolId, studentId, schoolName, termName, startDate, enforcementDate, state, restricted]
      properties:
        schoolId: { type: integer }
        studentId: { type: [integer, 'null'] }
        schoolName: { type: string }
        termName: { type: [string, 'null'] }
        startDate: { type: [string, 'null'] }
        enforcementDate: { type: [string, 'null'] }
        state: { type: string }
        restricted: { type: boolean }
        restrictionReason: { type: [string, 'null'], enum: [SCHOOL_SUBSCRIPTION_LOCKED, SUBSCRIPTION_RESTRICTED, null] }