        providerBusinessId: { type: ["string", "null"] }
        providerSubaccountId: { type: ["string", "null"] }
        capability: { $ref: "#/components/schemas/SettlementProviderCapability" }
        updatedAt: { type: ["string", "null"], format: date-time }
    SchoolSettlementSummary:
      type: object
      required: [schoolId, schoolName, status, currency, provider, capability, updatedAt]
