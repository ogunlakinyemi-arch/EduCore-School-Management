        settlementContactPhone: { type: ["string", "null"] }
        bankName: { type: ["string", "null"] }
        bankCode: { type: ["string", "null"] }
        accountName: { type: ["string", "null"] }
        accountLast4: { type: ["string", "null"], pattern: "^[0-9]{4}$" }
